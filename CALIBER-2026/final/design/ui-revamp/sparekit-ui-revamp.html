<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparekit UI Revamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap">
<style>/* Layout concept: a neutral curation bar on top; under it each option is its own full world with its own type and palette. */
:root {
  --chrome: #16181b;
  --chrome-2: #24272b;
  --chrome-ink: #f3f4f2;
  --chrome-dim: #a2a7ab;
  --chrome-hi: #f2b33d;
  --ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--chrome); color: var(--chrome-ink); font-family: var(--ui); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--chrome-hi); outline-offset: 2px; }
h1, h2, h3, h4, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
svg { display: block; }

/* ---------- curation bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: var(--chrome); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-bottom: 1px solid #000; }
.bar-name { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.bar-name small { font-weight: 400; color: var(--chrome-dim); font-size: 12.5px; margin-left: 6px; }
.seg { display: inline-flex; background: var(--chrome-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { height: 30px; padding: 0 12px; border-radius: 8px; color: var(--chrome-dim); font-size: 13px; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button:hover { color: var(--chrome-ink); }
.seg button[aria-pressed="true"] { background: var(--chrome-ink); color: var(--chrome); font-weight: 600; }
.seg button.is-pick::after { content: "★"; margin-left: 5px; color: var(--chrome-hi); }
.bar-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.tool { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--chrome-2); font-size: 13px; color: var(--chrome-ink); }
.tool[aria-pressed="true"] { background: var(--chrome-hi); color: #1c1407; font-weight: 600; }
.tool:disabled { opacity: .4; cursor: not-allowed; }
.tool-pick { background: var(--chrome-hi); color: #1c1407; font-weight: 600; }
.brief { background: var(--chrome-2); color: var(--chrome-dim); font-size: 13px; line-height: 1.45; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brief b { color: var(--chrome-ink); font-weight: 600; }

.stage-wrap { position: relative; overflow: hidden; }
.opt[hidden], .screen[hidden] { display: none !important; }

/* before / compare */
.before { background: #edf0f2; }
.before img { display: block; width: 100%; height: auto; }
.cmp { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.cmp-img { position: absolute; inset: 0; overflow: hidden; background: #edf0f2; }
.cmp-img img { display: block; width: 100%; height: auto; max-width: none; }
.cmp-handle { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; pointer-events: auto; cursor: ew-resize; touch-action: none; }
.cmp-handle::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: var(--chrome-hi); }
.cmp-grip { position: sticky; top: 45vh; margin: 45vh auto 0; width: 44px; height: 44px; border-radius: 50%; background: var(--chrome-hi); color: #1c1407; display: grid; place-items: center; font-weight: 700; font-size: 13px; box-shadow: 0 6px 20px rgb(0 0 0 / .3); }
.cmp-tag { position: absolute; top: 12px; padding: 4px 10px; border-radius: 99px; background: rgb(0 0 0 / .72); color: #fff; font-size: 12px; font-weight: 600; }

/* pick panel */
.pick { position: fixed; z-index: 70; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow: auto; background: var(--chrome); color: var(--chrome-ink); border-radius: 18px; padding: 18px; box-shadow: 0 28px 60px rgb(0 0 0 / .45); display: grid; gap: 14px; }
.pick h3 { font-size: 16px; font-weight: 600; }
.pick-row { display: grid; gap: 6px; }
.pick-row > span { font-size: 12.5px; color: var(--chrome-dim); }
.pick textarea { width: 100%; min-height: 76px; resize: vertical; border-radius: 10px; border: 1px solid #3b3f44; background: var(--chrome-2); color: var(--chrome-ink); font: inherit; padding: 9px 10px; }
.pick-foot { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.pick-out { display: block; white-space: pre-wrap; font-family: var(--mono); font-size: 11.5px; background: var(--chrome-2); padding: 9px 10px; border-radius: 10px; color: var(--chrome-dim); user-select: all; }

/* ---------- shared option tokens ---------- */
.opt { color: var(--ink); font-family: var(--font); background: var(--bg); font-feature-settings: "tnum" 1; }
.theme-a { --bg: #f4efe9; --card: #ffffff; --ink: #1d1a17; --ink2: #6e6861; --ink3: #a59e96; --line: rgb(40 25 10 / .09); --accent: #f0671c; --accent-soft: #fde8da; --accent-ink: #b5460d; --act: #d8402a; --act-soft: #fdebe7; --act-ink: #a52c1b; --plan: #e6a213; --plan-soft: #fdf3d9; --plan-ink: #8a5f00; --ready: #2e9a5c; --ready-soft: #e6f4ea; --ready-ink: #1c7442; --arrow: #17140f; --rail: #fff; --task: #f3e9df; --font: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; --num: "Instrument Sans", ui-sans-serif, sans-serif; --mesh: radial-gradient(60% 90% at 88% 10%, #ffcf9a 0, transparent 60%), radial-gradient(60% 90% at 8% 100%, #ffd9c2 0, transparent 60%); --r: 26px; }
.theme-b { --bg: #e5efe9; --card: rgb(255 255 255 / .78); --ink: #10231a; --ink2: #51625a; --ink3: #8c9a93; --line: rgb(10 40 25 / .09); --accent: #1a6b43; --accent-soft: #dcefe2; --accent-ink: #114e30; --act: #d9412e; --act-soft: #fbe6e1; --act-ink: #a12c1c; --plan: #e0a90f; --plan-soft: #fbf3d2; --plan-ink: #7f6000; --ready: #2c9e5a; --ready-soft: #dff3e6; --ready-ink: #157a41; --arrow: #0c2118; --rail: #fff; --task: #d5e5e0; --font: "Outfit", ui-sans-serif, system-ui, sans-serif; --num: "Outfit", ui-sans-serif, sans-serif; --mesh: radial-gradient(60% 90% at 85% 0, #c8ecd1 0, transparent 60%), radial-gradient(70% 90% at 5% 100%, #cfe7f2 0, transparent 60%); --r: 26px; }
.theme-c { --bg: #dfe0dd; --card: #ffffff; --ink: #121314; --ink2: #5f6163; --ink3: #9a9c9e; --line: rgb(0 0 0 / .08); --accent: #121314; --accent-soft: #eceded; --accent-ink: #121314; --act: #d5442f; --act-soft: #f9e6e1; --act-ink: #a02d1c; --plan: #e49a22; --plan-soft: #fbefd9; --plan-ink: #8a5a06; --ready: #2d9a5c; --ready-soft: #e1f2e7; --ready-ink: #177a42; --arrow: #101112; --rail: #fff; --task: #e6e6e3; --font: "Sora", ui-sans-serif, system-ui, sans-serif; --num: "Sora", ui-sans-serif, sans-serif; --mesh: radial-gradient(38% 60% at 38% 0, #e69322 0, transparent 70%), radial-gradient(30% 60% at 54% 42%, #f5d36b 0, transparent 70%), radial-gradient(34% 60% at 88% 8%, #6d8fa3 0, transparent 72%); --r: 28px; }

.inner { max-width: 1500px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.crit { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--arrow); color: #fff; flex: none; }
.crit.B { background: #4a5058; }
.crit.C { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.crit.S { background: #eceded; color: var(--ink2); }
.arrow { width: 38px; height: 38px; border-radius: 50%; background: var(--arrow); color: #fff; display: grid; place-items: center; flex: none; transition: transform .18s; }
.arrow svg { width: 15px; height: 15px; }
a.mcard:hover .arrow, button.mcard:hover .arrow { transform: rotate(45deg); }
.ic { width: 16px; height: 16px; flex: none; }

/* ---------- ref 3: metric cards ---------- */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mcard { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 176px; padding: 18px; background: var(--card); border-radius: var(--r); box-shadow: 0 1px 0 rgb(255 255 255 / .6) inset, 0 12px 28px -18px rgb(0 0 0 / .25); text-align: left; overflow: hidden; }
.mcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.mcard-ico { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); flex: none; }
.mcard-label { margin-top: 8px; font-size: 14px; font-weight: 500; line-height: 1.2; }
.mcard-sub { margin-top: 3px; font-size: 11.5px; color: var(--ink2); line-height: 1.3; }
.mcard-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 12px; }
.mcard-num { font-size: 40px; font-weight: 600; line-height: .95; letter-spacing: -0.03em; }
.mcard-num small { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--ink2); margin-left: 2px; }
.mcard-viz { flex: 1 1 auto; min-width: 0; max-width: 58%; }
.mcard.glow { color: #fff; background: radial-gradient(80% 90% at 15% 15%, #5f4a3e 0, transparent 60%), radial-gradient(80% 90% at 70% 40%, #4f7fa3 0, transparent 65%), radial-gradient(70% 70% at 80% 100%, #efb06b 0, transparent 70%), #1d2730; }
.mcard.glow .mcard-sub, .mcard.glow .mcard-num small { color: rgb(255 255 255 / .78); }
.mcard.glow .mcard-ico { border-color: rgb(255 255 255 / .3); color: #fff; }
.mcard.glow .arrow { background: #fff; color: #111; }
.dotrow { display: flex; align-items: center; gap: 5px; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; }
.dotrow i { flex: none; }
.dotrow i { display: block; border-radius: 50%; background: currentColor; }

/* ref 3: dark lower band */
.band { background: #0f1011; color: #f2f2f0; border-radius: var(--r) var(--r) 0 0; margin-top: 18px; }
.band-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 34px; padding-block: 28px 34px; }
.band h3 { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; }
.band-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ghost-pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.ghost-pills button { height: 30px; padding: 0 13px; border-radius: 99px; border: 1px solid rgb(255 255 255 / .22); color: rgb(255 255 255 / .7); font-size: 12px; }
.ghost-pills button[aria-pressed="true"] { color: #fff; border-color: #fff; }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.offer { border-radius: 22px; padding: 15px; min-height: 174px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.offer:nth-child(1) { background: linear-gradient(150deg, #7b6a60, #a9a29b 52%, #455057); }
.offer:nth-child(2) { background: radial-gradient(90% 90% at 40% 50%, #93a53c, #40501c 80%); }
.offer:nth-child(3) { background: linear-gradient(150deg, #6d7377, #b4a39d 60%, #4e4644); }
.offer-name { font-size: 13.5px; line-height: 1.25; font-weight: 500; }
.offer-sub { font-size: 11px; opacity: .78; margin-top: 3px; font-family: var(--mono); }
.offer-grid { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.offer-grid small { display: block; font-size: 10.5px; opacity: .78; margin-bottom: 2px; }
.offer-grid b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.runway { position: relative; margin-top: 18px; }
.runway svg { width: 100%; height: auto; overflow: visible; }

/* ---------- option A: ref 2 ---------- */
.a-page { background: var(--mesh), var(--bg); padding-block: 22px 0; }
.a-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
.logo-mark { width: 30px; height: 30px; flex: none; }
.a-nav { display: flex; gap: 3px; margin-left: 16px; flex-wrap: wrap; }
.a-nav button { height: 34px; padding: 0 14px; font-size: 13px; color: var(--ink2); border-radius: 10px 10px 4px 4px; }
.a-nav button[aria-current] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 6px 16px -10px rgb(0 0 0 / .4); }
.a-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; width: 230px; padding: 0 12px; border-radius: 12px; background: var(--card); color: var(--ink3); font-size: 13px; box-shadow: 0 6px 16px -12px rgb(0 0 0 / .4); }
.icbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--card); color: var(--ink2); position: relative; box-shadow: 0 6px 16px -12px rgb(0 0 0 / .4); flex: none; }
.icbtn .badge { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.chipuser { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 12.5px; background: var(--accent); flex: none; }
.a-grid { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 18px; margin-top: 12px; }
.crumb { display: flex; gap: 7px; font-size: 12.5px; color: var(--ink3); align-items: center; flex-wrap: wrap; }
.a-title { font-size: clamp(30px, 3.1vw, 44px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.08; margin-top: 8px; }
.tag-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.tag { height: 32px; padding: 0 12px; border-radius: 10px; font-size: 12.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 7px; }
.tag[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 6px 16px -10px rgb(0 0 0 / .35); }
.tag .sq { width: 20px; height: 20px; border-radius: 6px; background: var(--arrow); color: #fff; font-size: 10.5px; display: grid; place-items: center; }
.stage { position: relative; height: 560px; margin-top: -38px; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.leaders polyline { fill: none; stroke: rgb(40 25 10 / .45); stroke-width: 1; }
.leaders circle { fill: var(--accent); stroke: #fff; stroke-width: 2; }
.thumbs { position: absolute; left: 0; top: 96px; display: grid; gap: 8px; z-index: 3; }
.thumb { width: 62px; height: 62px; border-radius: 14px; background: rgb(255 255 255 / .7); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.thumb[aria-pressed="true"] { background: #fff; box-shadow: inset 0 0 0 2px var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.callout { position: absolute; z-index: 3; width: 196px; padding: 11px 12px; background: var(--card); border-radius: 12px; box-shadow: 0 14px 30px -18px rgb(30 15 0 / .45), 0 0 0 1px var(--line); }
.callout h4 { font-size: 12.5px; font-weight: 600; line-height: 1.22; padding-right: 22px; }
.callout .co-tag { font-size: 10.5px; color: var(--ink3); font-family: var(--mono); margin-top: 2px; }
.callout .co-num { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin-top: 6px; line-height: 1; }
.callout .co-num small { font-size: 12px; color: var(--ink2); letter-spacing: 0; }
.callout .co-lead { font-size: 11px; color: var(--act-ink); margin-top: 4px; }
.callout .co-go { position: absolute; top: 9px; right: 9px; width: 22px; height: 22px; border-radius: 7px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); }
.callout .co-go svg { width: 11px; height: 11px; }
.c0 { left: 88px; top: 112px; } .c1 { right: 12px; top: 58px; } .c2 { left: 92px; bottom: 34px; } .c3 { right: 12px; bottom: 58px; }
.stage-tools { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.pillbtn { height: 36px; padding: 0 15px; border-radius: 99px; background: var(--arrow); color: #fff; font-size: 13px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; }
.pillnote { font-size: 11.5px; color: var(--ink2); background: rgb(255 255 255 / .7); padding: 5px 10px; border-radius: 99px; }
.side { display: grid; gap: 12px; align-content: start; }
.period { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink2); flex-wrap: wrap; }
.period .sw { display: inline-flex; gap: 2px; }
.period button { height: 32px; padding: 0 12px; border-radius: 10px; font-size: 12.5px; color: var(--ink2); }
.period button[aria-pressed="true"] { background: var(--arrow); color: #fff; font-weight: 500; }
.panel { background: var(--card); border-radius: 18px; padding: 15px 16px; box-shadow: 0 12px 26px -20px rgb(30 15 0 / .4); }
.panel-head { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 600; gap: 8px; }
.gauge { position: relative; margin-top: 6px; }
.gauge svg { width: 100%; height: auto; }
.gauge-num { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; }
.gauge-num b { font-size: 46px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; display: block; }
.gauge-num span { font-size: 12px; color: var(--ink2); }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 8px; font-size: 13px; color: var(--ink2); border-top: 1px solid var(--line); }
.kv b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.kv span { display: flex; gap: 8px; align-items: center; }
.alert { display: flex; gap: 9px; padding: 10px 11px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 1.25; margin-top: 7px; }
.alert small { display: block; font-weight: 400; font-size: 11.5px; margin-top: 2px; opacity: .85; }
.alert time { margin-left: auto; font-size: 11px; font-weight: 500; white-space: nowrap; opacity: .85; }
.alert.act { background: var(--act-soft); color: var(--act-ink); }
.alert.plan { background: var(--plan-soft); color: var(--plan-ink); }
.alert.ready { background: var(--ready-soft); color: var(--ready-ink); }
.alert i { width: 9px; height: 9px; border-radius: 3px; background: currentColor; margin-top: 3px; flex: none; }
.matrix-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 2px; }
.matrix-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.matrix-head b { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.matrix-head span { font-size: 12px; color: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 5px 13px; font-size: 11.5px; color: var(--ink2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2.5px; margin-right: 5px; }
.matrix { display: grid; grid-auto-flow: column; grid-template-rows: repeat(9, 1fr); gap: 3px; margin-top: 11px; overflow-x: auto; scrollbar-width: none; }
.matrix i { display: block; width: 100%; min-width: 7px; aspect-ratio: 1; border-radius: 2px; }
.section-gap { padding-block: 18px 0; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 21px; font-weight: 500; letter-spacing: -0.015em; margin-bottom: 12px; flex-wrap: wrap; }
.section-title small { font-size: 12.5px; font-weight: 400; color: var(--ink2); letter-spacing: 0; }

/* ---------- option B: ref 1 ---------- */
.b-page { position: relative; overflow: hidden; padding-block: 40px 0; background: linear-gradient(180deg, #3f6d9f 0, #80a8c9 16%, #d5d0c2 30%, #bcd279 44%, #84b62f 62%, #4d8a20 100%); }

<script>/* Procedural 3D for the Sparekit mockups. No external models: every machine is built from primitives. */
(function () {
  const T = window.THREE;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const PAL = {
    hall: { body: 0xe8480a, dark: 0x24282d, steel: 0xb9bfc5, light: 0xe9e6e2, brass: 0xc99a4b, key: 0xfff4e6, fill: 0xffffff, env: 1.0, floor: 0.2 },
    deck: { body: 0x1b1d20, dark: 0x0d0e10, steel: 0xc9ccd0, light: 0x34373c, brass: 0xe9a23b, key: 0xffe4bd, fill: 0xbfe3ff, env: 1.25, floor: 0.32 },
  };

  function envTexture(renderer, warm) {
    const s = new T.Scene();
    const room = new T.Mesh(new T.BoxGeometry(20, 20, 20), new T.MeshBasicMaterial({ color: warm ? 0xdcd8d2 : 0xb8bcc0, side: T.BackSide }));
    s.add(room);
    const panel = (x, y, z, w, h, c, i) => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(c).multiplyScalar(i), side: T.DoubleSide }));
      m.position.set(x, y, z);
      m.lookAt(0, 0, 0);
      s.add(m);
    };
    panel(0, 9.5, 0, 12, 12, 0xffffff, 5);
    panel(-9, 3, 5, 6, 10, 0xffffff, 3.2);
    panel(9, 2, 4, 3, 12, warm ? 0xffd9b0 : 0xffb35a, 3.5);
    panel(0, 1, -9.5, 14, 3, 0xffffff, 1.6);
    const floor = new T.Mesh(new T.PlaneGeometry(20, 20), new T.MeshBasicMaterial({ color: 0x55585c }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -9.8;
    s.add(floor);
    const pm = new T.PMREMGenerator(renderer);
    const tex = pm.fromScene(s, 0.04).texture;
    pm.dispose();
    return tex;
  }

  const std = (color, metal, rough, extra) => new T.MeshStandardMaterial(Object.assign({ color, metalness: metal, roughness: rough }, extra || {}));
  function mesh(geo, mat, x, y, z) {
    const m = new T.Mesh(geo, mat);
    m.castShadow = m.receiveShadow = true;
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }
  const cylX = (r, len, seg, r2) => new T.CylinderGeometry(r2 == null ? r : r2, r, len, seg || 48).rotateZ(-Math.PI / 2);
  const cylZ = (r, len, seg) => new T.CylinderGeometry(r, r, len, seg || 48).rotateX(Math.PI / 2);
  const cylY = (r, len, seg) => new T.CylinderGeometry(r, r, len, seg || 48);

  function rbox(w, h, d, r) {
    const sh = new T.Shape();
    const x = -w / 2, y = -d / 2;
    sh.moveTo(x + r, y);
    sh.lineTo(x + w - r, y);
    sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + d - r);
    sh.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
    sh.lineTo(x + r, y + d);
    sh.quadraticCurveTo(x, y + d, x, y + d - r);
    sh.lineTo(x, y + r);
    sh.quadraticCurveTo(x, y, x + r, y);
    const g = new T.ExtrudeGeometry(sh, { depth: h - 0.04, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3, curveSegments: 8 });
    g.rotateX(Math.PI / 2);
    g.translate(0, h / 2, 0);
    return g;
  }

  /* Bolted flange in the YZ plane (axis along X). */
  function flange(group, x, y, z, r, mat, boltMat, n, axis) {
    const f = new T.Group();
    f.add(mesh(cylX(r, 0.07, 48), mat));
    const count = n || 10;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      f.add(mesh(cylX(0.022, 0.1, 8), boltMat, 0.02, Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82));
    }
    f.position.set(x, y, z);
    if (axis === "y") f.rotation.z = Math.PI / 2;
    if (axis === "z") f.rotation.y = Math.PI / 2;
    group.add(f);
    return f;
  }

  /* Pump volute: a spiral tube whose radius grows with the angle, ending tangent into the discharge. */
  function volute(mat) {
    const rings = 96, seg = 24, pos = [], idx = [];
    const turn = Math.PI * 2 * 0.98;
    for (let i = 0; i <= rings; i++) {
      const t = i / rings, th = t * turn;
      const r = 0.1 + 0.2 * t, R = 0.56 + r + 0.04 * t;
      const cy = Math.cos(th) * R, cz = Math.sin(th) * R;
      for (let j = 0; j < seg; j++) {
        const p = (j / seg) * Math.PI * 2;
        const rad = R + Math.cos(p) * r;
        pos.push(Math.sin(p) * r * 0.82, Math.cos(th) * rad, Math.sin(th) * rad);
      }
      void cy; void cz;
    }
    for (let i = 0; i < rings; i++)
      for (let j = 0; j < seg; j++) {
        const a = i * seg + j, b = i * seg + ((j + 1) % seg), c = a + seg, d = b + seg;
        idx.push(a, c, b, b, c, d);
      }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return mesh(g, mat);
  }

  function buildPump(p) {
    const root = new T.Group(), parts = [], anchors = {};
    const body = std(p.body, 0.25, 0.32), dark = std(p.dark, 0.55, 0.48), steel = std(p.steel, 0.92, 0.28), light = std(p.light, 0.3, 0.55), brass = std(p.brass, 0.85, 0.3);
    const y0 = 0.86;

    /* skid */
    root.add(mesh(rbox(5.3, 0.16, 1.9, 0.08), light, 0, 0.08, 0));
    for (const z of [-0.8, 0.8]) root.add(mesh(new T.BoxGeometry(5.1, 0.1, 0.1), dark, 0, 0.21, z));

    /* motor */
    const motor = new T.Group();
    motor.add(mesh(cylX(0.62, 1.75, 64), dark, -1.45, y0, 0));
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2;
      const fin = mesh(new T.BoxGeometry(1.58, 0.1, 0.028), dark, -1.45, y0 + Math.cos(a) * 0.65, Math.sin(a) * 0.65);
      fin.rotation.x = -a;
      motor.add(fin);
    }
    motor.add(mesh(cylX(0.68, 0.14, 64), body, -0.58, y0, 0));
    motor.add(mesh(cylX(0.68, 0.14, 64), body, -2.34, y0, 0));
    const cap = mesh(new T.SphereGeometry(0.56, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2).rotateZ(Math.PI / 2).scale(0.5, 1, 1), dark, -2.41, y0, 0);
    motor.add(cap);
    motor.add(mesh(rbox(0.56, 0.22, 0.44, 0.04), body, -1.45, y0 + 0.74, 0));
    for (const x of [-2.1, -0.8]) motor.add(mesh(new T.BoxGeometry(0.34, 0.3, 1.34), dark, x, 0.36, 0));
    root.add(motor);

    /* coupling guard */
    const guard = mesh(cylX(0.34, 0.68, 48), body, -0.17, y0, 0);
    root.add(guard);

    /* bearing housing, pulls out in the exploded view */
    const brg = new T.Group();
    brg.add(mesh(cylX(0.32, 0.72, 48), steel, 0.5, y0, 0));
    for (const x of [0.25, 0.5, 0.75]) brg.add(mesh(cylX(0.36, 0.05, 48), steel, x, y0, 0));
    const pedestal = mesh(new T.BoxGeometry(0.72, 0.42, 0.8), light, 0.5, 0.42, 0);
    root.add(pedestal);
    root.add(brg);
    const shaft = mesh(cylX(0.075, 2.6, 24), steel, 1.0, y0, 0);
    root.add(shaft);

    /* rear casing */
    const casing = new T.Group();
    const vol = volute(body);
    casing.add(vol);
    casing.add(mesh(cylX(0.6, 0.2, 64), body, 0, 0, 0));
    /* discharge: picks up where the spiral ends at the top */
    casing.add(mesh(cylZ(0.27, 0.5, 40), body, 0, 0.98, -0.24));
    const dis = mesh(new T.CylinderGeometry(0.2, 0.26, 0.5, 40), body, 0, 1.3, -0.3);
    casing.add(dis);
    flange(casing, 0, 1.56, -0.3, 0.33, body, steel, 10, "y");
    casing.position.set(1.34, y0, 0);
    root.add(casing);
    const foot = mesh(new T.BoxGeometry(0.64, 0.5, 1.1), body, 1.34, 0.4, 0);
    root.add(foot);

    /* impeller */
    const imp = new T.Group();
    imp.add(mesh(cylX(0.5, 0.05, 56), brass, -0.09, 0, 0));
    imp.add(mesh(cylX(0.5, 0.04, 56), brass, 0.11, 0, 0));
    imp.add(mesh(cylX(0.13, 0.32, 24, 0.09), brass, 0.02, 0, 0));
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const v = mesh(new T.BoxGeometry(0.18, 0.4, 0.024), brass, 0.01, Math.cos(a) * 0.3, Math.sin(a) * 0.3);
      v.rotation.x = -a + 0.5;
      imp.add(v);
    }
    imp.position.set(1.46, y0, 0);
    root.add(imp);

    /* seal, sits between casing and bearing */
    const seal = new T.Group();
    seal.add(mesh(new T.TorusGeometry(0.2, 0.035, 14, 48).rotateY(Math.PI / 2), dark));
    seal.add(mesh(cylX(0.16, 0.12, 32), steel, 0.07, 0, 0));
    seal.position.set(1.02, y0, 0);
    root.add(seal);

    /* suction cover and nozzle */
    const cover = new T.Group();
    cover.add(mesh(cylX(0.6, 0.12, 64), body, 0, 0, 0));
    cover.add(mesh(cylX(0.26, 0.48, 40, 0.34), body, 0.28, 0, 0));
    flange(cover, 0.54, 0, 0, 0.42, body, steel, 12);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      cover.add(mesh(cylX(0.024, 0.2, 8), steel, 0, Math.cos(a) * 0.54, Math.sin(a) * 0.54));
    }
    cover.position.set(1.6, y0, 0);
    root.add(cover);

    parts.push({ o: cover, d: new T.Vector3(1.05, 0, 0) });
    parts.push({ o: imp, d: new T.Vector3(0.68, 0, 0) });
    parts.push({ o: seal, d: new T.Vector3(0.15, 0.72, 0) });
    parts.push({ o: brg, d: new T.Vector3(0, 0.0, 0) });
    parts.push({ o: motor, d: new T.Vector3(-0.3, 0, 0) });
    parts.push({ o: guard, d: new T.Vector3(-0.2, 0, 0) });

    const a = (n, parent, x, y, z) => {
      const o = new T.Object3D();
      o.position.set(x, y, z);
      parent.add(o);
      anchors[n] = o;
    };
    a("impeller", imp, 0.12, 0.42, 0.22);
    a("bearing", brg, 0.5, y0 + 0.36, 0);
    a("ring", seal, 0, 0.2, 0);
    a("flange", cover, 0.56, 0.3, 0.3);
    root.position.set(-0.1, 0, 0);
    return { root, parts, anchors, cam: [1.2, 3.25, 7.9], look: [0.05, 0.92, 0], rot: -0.42 };
  }

  function buildFurnace(p) {
    const root = new T.Group(), parts = [], anchors = {};
    const body = std(p.body, 0.25, 0.34), dark = std(p.dark, 0.55, 0.5), steel = std(p.steel, 0.9, 0.3), light = std(p.light, 0.25, 0.6), fire = std(p.brass, 0.85, 0.32);
    root.add(mesh(rbox(5.4, 0.14, 3.2, 0.08), light, 0, 0.07, 0));
    /* legs */
    for (const x of [-1.9, 0, 1.9]) for (const z of [-0.85, 0.85]) root.add(mesh(new T.BoxGeometry(0.14, 0.75, 0.14), dark, x, 0.5, z));
    /* radiant box, the front wall lifts off in the exploded view */
    const back = mesh(new T.BoxGeometry(4.2, 1.9, 0.08), body, 0, 1.82, -0.86);
    root.add(back);
    root.add(mesh(new T.BoxGeometry(4.2, 0.1, 1.8), dark, 0, 0.85, 0));
    root.add(mesh(new T.BoxGeometry(4.2, 0.1, 1.8), body, 0, 2.78, 0));
    for (const x of [-2.08, 2.08]) root.add(mesh(new T.BoxGeometry(0.08, 1.9, 1.8), body, x, 1.82, 0));
    /* lining */
    root.add(mesh(new T.BoxGeometry(4.0, 1.78, 0.05), std(0xe7ddcf, 0, 0.92), 0, 1.82, -0.8));
    /* serpentine coils */
    const coils = new T.Group();
    for (let i = 0; i < 9; i++) {
      const x = -1.68 + i * 0.42;
      coils.add(mesh(cylY(0.055, 1.55, 18), steel, x, 1.82, -0.1));
      coils.add(mesh(new T.TorusGeometry(0.21, 0.055, 12, 20, Math.PI), steel, x + 0.21, i % 2 ? 1.05 : 2.6, -0.1));
      if (!(i % 2)) coils.children[coils.children.length - 1].rotation.z = 0;
      else coils.children[coils.children.length - 1].rotation.z = Math.PI;
    }
    root.add(coils);
    /* burners along the floor */
    for (let i = 0; i < 8; i++) root.add(mesh(cylY(0.09, 0.26, 18), dark, -1.6 + i * 0.46, 0.72, 0.42));
    /* front wall with ribs */
    const front = new T.Group();
    front.add(mesh(new T.BoxGeometry(4.24, 1.9, 0.07), body, 0, 0, 0));
    for (let i = 0; i < 6; i++) front.add(mesh(new T.BoxGeometry(0.05, 1.9, 0.06), dark, -1.9 + i * 0.76, 0, 0.05));
    for (let i = 0; i < 3; i++) {
      const port = mesh(cylZ(0.11, 0.06, 24), steel, -1.14 + i * 1.14, 0.25, 0.06);
      front.add(port);
    }
    front.position.set(0, 1.82, 0.9);
    root.add(front);
    /* convection section */
    root.add(mesh(new T.BoxGeometry(2.3, 0.72, 1.3), dark, 0, 3.2, 0));
    for (let i = 0; i < 5; i++) root.add(mesh(cylX(0.04, 2.34, 12), steel, 0, 3.0 + i * 0.1, 0.67));
    root.add(mesh(new T.CylinderGeometry(0.28, 0.85, 0.5, 4).rotateY(Math.PI / 4).scale(1.1, 1, 0.8), body, 0, 3.8, 0));
    root.add(mesh(new T.CylinderGeometry(0.2, 0.24, 1.5, 32), dark, 0, 4.72, 0));
    root.add(mesh(cylY(0.25, 0.08, 32), body, 0, 5.46, 0));
    /* crossover and manifold */
    const pipeAnchor = new T.Group();
    pipeAnchor.add(mesh(cylX(0.1, 3.6, 24), steel, 0, 3.05, 1.08));
    for (const x of [-1.4, 1.4]) pipeAnchor.add(mesh(cylY(0.09, 0.4, 20), steel, x, 2.86, 1.08));
    root.add(pipeAnchor);
    const valve = new T.Group();
    valve.add(mesh(cylX(0.13, 0.28, 24), body));
    valve.add(mesh(cylY(0.03, 0.3, 10), steel, 0, 0.26, 0));
    valve.add(mesh(new T.TorusGeometry(0.12, 0.018, 10, 28).rotateX(Math.PI / 2), dark, 0, 0.42, 0));
    valve.position.set(0.62, 3.05, 1.08);
    root.add(valve);
    /* platform */
    root.add(mesh(new T.BoxGeometry(4.5, 0.05, 0.42), light, 0, 2.86, -1.14));
    for (let i = 0; i < 7; i++) root.add(mesh(cylY(0.018, 0.5, 8), dark, -2.2 + i * 0.73, 3.12, -1.32));
    root.add(mesh(cylX(0.02, 4.45, 8), dark, 0, 3.36, -1.32));

    parts.push({ o: front, d: new T.Vector3(0, 0, 1.15) });
    parts.push({ o: pipeAnchor, d: new T.Vector3(0, 0.36, 0.55) });
    parts.push({ o: valve, d: new T.Vector3(0.3, 0.68, 0.6) });
    const a = (n, parent, x, y, z) => {
      const o = new T.Object3D();
      o.position.set(x, y, z);
      parent.add(o);
      anchors[n] = o;
    };
    a("wall", root, -1.5, 1.5, -0.76);
    a("anchor", root, 1.7, 2.3, -0.76);
    a("pipe", pipeAnchor, -1.0, 3.05, 1.1);
    a("valve", valve, 0, 0.42, 0);
    root.position.set(0, 0, 0);
    return { root, parts, anchors, cam: [3.8, 4.9, 12.2], look: [0, 2.55, 0], rot: -0.34 };
  }

  function buildExchanger(p) {
    const root = new T.Group(), parts = [], anchors = {};
    const body = std(p.body, 0.25, 0.34), dark = std(p.dark, 0.55, 0.48), steel = std(p.steel, 0.92, 0.28), light = std(p.light, 0.3, 0.55);
    const y0 = 1.2;
    root.add(mesh(rbox(5.8, 0.14, 2.3, 0.08), light, 0, 0.07, 0));
    for (const x of [-1.5, 1.3]) {
      root.add(mesh(new T.BoxGeometry(0.34, 0.5, 1.3), dark, x, 0.42, 0));
      root.add(mesh(new T.TorusGeometry(0.7, 0.05, 12, 48, Math.PI).rotateX(Math.PI).rotateY(Math.PI / 2), dark, x, y0, 0));
    }
    /* shell */
    root.add(mesh(cylX(0.66, 3.5, 64), dark, -0.15, y0, 0));
    root.add(mesh(new T.SphereGeometry(0.66, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2).rotateZ(Math.PI / 2).scale(0.45, 1, 1), dark, -1.9, y0, 0));
    for (const x of [-1.2, 0.3, 1.25]) root.add(mesh(cylX(0.68, 0.06, 64), body, x, y0, 0));
    /* shell nozzles */
    for (const [x, s] of [[-1.05, 1], [0.95, -1]]) {
      root.add(mesh(cylY(0.17, 0.55, 28), steel, x, y0 + s * 0.84, 0));
      const f = mesh(cylY(0.27, 0.06, 32), body, x, y0 + s * 1.1, 0);
      root.add(f);
    }
    /* shell flange */
    const shellF = flange(root, 1.61, y0, 0, 0.82, body, steel, 22);
    /* tube bundle, slides out in the exploded view */
    const bundle = new T.Group();
    const tsheet = mesh(cylX(0.62, 0.09, 56), steel, 1.68, 0, 0);
    bundle.add(tsheet);
    for (let r = 0.14; r < 0.56; r += 0.14) {
      const n = Math.round(r * 42);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        bundle.add(mesh(cylX(0.026, 3.2, 8), steel, 0.05, Math.cos(a) * r, Math.sin(a) * r));
      }
    }
    for (const x of [-1.2, -0.5, 0.2, 0.9]) bundle.add(mesh(cylX(0.6, 0.03, 48), light, x, 0, 0));
    bundle.position.set(0, y0, 0);
    root.add(bundle);
    /* channel head */
    const head = new T.Group();
    head.add(mesh(cylX(0.72, 0.62, 64), body, 0.42, 0, 0));
    flange(head, 0.08, 0, 0, 0.84, body, steel, 22);
    flange(head, 0.76, 0, 0, 0.84, body, steel, 22);
    head.add(mesh(cylY(0.2, 0.5, 28), steel, 0.42, 0.86, 0));
    head.add(mesh(cylY(0.3, 0.06, 32), body, 0.42, 1.12, 0));
    head.add(mesh(cylY(0.2, 0.5, 28), steel, 0.42, -0.86, 0));
    head.position.set(1.72, y0, 0);
    root.add(head);
    const blind = new T.Group();
    blind.add(mesh(cylX(0.84, 0.08, 64), body));
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2;
      blind.add(mesh(cylX(0.024, 0.2, 8), steel, 0.02, Math.cos(a) * 0.72, Math.sin(a) * 0.72));
    }
    blind.position.set(2.56, y0, 0);
    root.add(blind);
    void shellF;

    parts.push({ o: blind, d: new T.Vector3(1.05, 0, 0) });
    parts.push({ o: head, d: new T.Vector3(0.55, 0.0, 0) });
    parts.push({ o: bundle, d: new T.Vector3(0.0, 0, 0) });
    const a = (n, parent, x, y, z) => {
      const o = new T.Object3D();
      o.position.set(x, y, z);
      parent.add(o);
      anchors[n] = o;
    };
    a("head", head, 0.42, 0.72, 0.1);
    a("blind", blind, 0, 0.5, 0.5);
    a("bolts", root, 1.61, y0 + 0.75, 0.25);
    a("pipe", root, -1.05, y0 + 1.1, 0);
    root.position.set(-0.3, 0, 0);
    return { root, parts, anchors, cam: [2.3, 3.3, 9.5], look: [0.2, 1.15, 0], rot: -0.38 };
  }

  const BUILD = { pump: buildPump, furnace: buildFurnace, exchanger: buildExchanger };

  function setupStage(canvas, opt) {
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: !!opt.keep });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.outputColorSpace = T.SRGBColorSpace;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = opt.exposure || 0.82;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.setClearColor(0, 0);
    return renderer;
  }

  function lights(scene, p) {
    const key = new T.DirectionalLight(p.key, 1.5);
    key.position.set(3.5, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 25 });
    key.shadow.radius = 7;
    key.shadow.bias = -0.0005;
    scene.add(key);
    const rim = new T.DirectionalLight(p.fill, 0.8);
    rim.position.set(-5, 3, -4);
    scene.add(rim);
    scene.add(new T.HemisphereLight(0xffffff, 0xcfc8bf, 0.15));
  }

  function floor(scene, p) {
    const f = new T.Mesh(new T.PlaneGeometry(40, 40), new T.ShadowMaterial({ opacity: p.floor }));
    f.rotation.x = -Math.PI / 2;
    f.receiveShadow = true;
    scene.add(f);
    const ring = new T.Mesh(new T.RingGeometry(3.9, 3.925, 128), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.13, side: T.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.005;
    scene.add(ring);
  }

  /* Interactive machine stage. */
  function Machine(canvas, o) {
    const p = PAL[o.palette || "hall"];
    const renderer = setupStage(canvas, {});
    const scene = new T.Scene();
    scene.environment = envTexture(renderer, o.palette !== "deck");
    scene.environmentIntensity = p.env;
    lights(scene, p);
    floor(scene, p);
    const camera = new T.PerspectiveCamera(27, 1, 0.1, 80);
    const pivot = new T.Group();
    scene.add(pivot);
    let current = null, rotY = 0, target = 0, tilt = 0, explode = 0, explodeTo = 0, running = true, drag = null, idle = true, baseRot = 0, raf = 0, fit = 1;
    const dims = { w: 1, h: 1 };
    const v = new T.Vector3();

    const load = (name) => {
      while (pivot.children.length) pivot.remove(pivot.children[0]);
      current = BUILD[name](p);
      current.parts.forEach((q) => (q.home = q.o.position.clone()));
      pivot.add(current.root);
      baseRot = current.rot;
      target = rotY = baseRot;
      explode = explodeTo = current.open || 0;
      frame();
    };

    const resize = () => {
      const r = canvas.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return;
      dims.w = r.width;
      dims.h = r.height;
      renderer.setSize(r.width, r.height, false);
      camera.aspect = r.width / r.height;
      /* keep the machine in frame on narrow stages */
      fit = Math.max(1, (o.fitK || 1.45) / camera.aspect);
      camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize);
    ro.observe(canvas);

    const frame = () => {
      if (!current) return;
      rotY += (target - rotY) * 0.08;
      explode += (explodeTo - explode) * 0.08;
      pivot.rotation.y = rotY;
      current.parts.forEach((q) => q.o.position.copy(q.home).addScaledVector(q.d, explode));
      camera.position.set(current.cam[0] * fit, current.cam[1] * fit + tilt, current.cam[2] * fit);
      camera.lookAt(current.look[0], current.look[1], current.look[2]);
      renderer.render(scene, camera);
      if (o.onFrame) o.onFrame(api);
    };
    const tick = (t) => {
      raf = requestAnimationFrame(tick);
      if (!running) return;
      if (idle && !reduce) target = baseRot + Math.sin(t * 0.00028) * 0.24;
      frame();
    };

    canvas.addEventListener("pointerdown", (e) => {
      drag = { x: e.clientX, y: e.clientY, r: target };
      idle = false;
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = "grabbing";
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      target = drag.r + (e.clientX - drag.x) * 0.007;
      tilt = Math.max(-1.5, Math.min(2.5, (e.clientY - drag.y) * 0.012));
    });
    const up = () => {
      drag = null;
      canvas.style.cursor = "grab";
    };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
    canvas.style.cursor = "grab";
    canvas.style.touchAction = "pan-y";

    const api = {
      load,
      resize,
      toggleExplode() {
        const closed = current.open || 0;
        explodeTo = explodeTo > closed + 0.01 ? closed : 1;
        return explodeTo === 1;
      },
      isExploded: () => explodeTo === 1,
      project(name) {
        const a = current && current.anchors[name];
        if (!a) return null;
        a.getWorldPosition(v);
        v.project(camera);
        return { x: (v.x * 0.5 + 0.5) * dims.w, y: (-v.y * 0.5 + 0.5) * dims.h };
      },
      start() {
        running = true;
        resize();
      },
      stop() {
        running = false;
      },
    };
    resize();
    load(o.model || "pump");
    raf = requestAnimationFrame(tick);
    void raf;
    return api;
  }

  /* One still render per model, for the machine picker. */
  function thumbs(palette) {
    const p = PAL[palette || "hall"];
    const c = document.createElement("canvas");
    const renderer = setupStage(c, { keep: true });
    renderer.setPixelRatio(1);
    renderer.setSize(220, 220, false);
    const scene = new T.Scene();
    scene.environment = envTexture(renderer, palette !== "deck");
    scene.environmentIntensity = p.env;
    lights(scene, p);
    const camera = new T.PerspectiveCamera(27, 1, 0.1, 80);
    const out = {};
    for (const name of Object.keys(BUILD)) {
      const m = BUILD[name](p);
      m.root.rotation.y = m.rot;
      (m.parts || []).forEach((q) => q.o.position.addScaledVector(q.d, m.open || 0));
      scene.add(m.root);
      const k = name === "furnace" ? 1.15 : 1.25;
      camera.position.set(m.cam[0] * k, m.cam[1] * k, m.cam[2] * k);
      camera.lookAt(m.look[0], m.look[1], m.look[2]);
      renderer.render(scene, camera);
      out[name] = c.toDataURL("image/png");
      scene.remove(m.root);
    }
    renderer.dispose();
    renderer.forceContextLoss && renderer.forceContextLoss();
    return out;
  }

  /* ---------- Plant site for option B: a white clay model on a map, with shortage contours painted on the ground. ---------- */
  function heatTexture(zones) {
    const S = 1024;
    const c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    /* map ground */
    g.fillStyle = "#e8eef0";
    g.fillRect(0, 0, S, S);
    /* water, the channel along the top and right, same pale blue as a road atlas */
    g.fillStyle = "#c7e0ee";
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(S, 0); g.lineTo(S, 420);
    g.bezierCurveTo(900, 380, 860, 240, 720, 190);

      g.beginPath(); g.roundRect(b[0], b[1], b[2], b[3], 40); g.fill();
    });
    /* roads */
    g.strokeStyle = "#ffffff"; g.lineWidth = 11; g.lineCap = "round";
    [[[60, 300], [960, 500]], [[60, 800], [940, 730]], [[250, 180], [190, 980]], [[770, 260], [720, 960]], [[60, 540], [950, 620]]].forEach((l) => {
      g.beginPath(); g.moveTo(l[0][0], l[0][1]); g.lineTo(l[1][0], l[1][1]); g.stroke();
    });

      g.beginPath(); g.moveTo(l[0][0], l[0][1]); g.lineTo(l[1][0], l[1][1]); g.stroke();
    });
    /* contour field: sum of gaussians, weighted by the real shortage per zone */
    const N = 256, img = g.createImageData(N, N), field = new Float32Array(N * N);
    let max = 0;
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++) {

          const dx = ((x / N) * S - z.x) / z.rx, dy = ((y / N) * S - z.y) / z.ry;

      [0.34, [176, 208, 92], 0.42],

    scene.add(new T.HemisphereLight(0xffffff, 0xbfd4d8, 0.2));

    const w = (px, py) => [(px / 1024 - 0.5) * W, (py / 1024 - 0.5) * W];
    const fz = o.furnaces;

    scene.add(ground);
    /* the atlas keeps going past the textured area */
    const beyond = new T.Mesh(new T.PlaneGeometry(200, 200), new T.MeshBasicMaterial({ color: 0xe8eef0, toneMapped: false }));
    beyond.rotation.x = -Math.PI / 2;

    const catcher = new T.Mesh(new T.PlaneGeometry(W, W), new T.ShadowMaterial({ opacity: 0.26 }));

    const clay = std(0xf4f3ee, 0, 0.72, { envMapIntensity: 0.55 }), clay2 = std(0xd6dbdc, 0.05, 0.6, { envMapIntensity: 0.55 }), pipe = std(0xc8ced2, 0.6, 0.4), accent = std(0x1f6b45, 0.1, 0.5);
    const place = (geo, mat, px, py, y) => {

    fz.forEach((f, i) => {
      const col = i % 6, row = i < 6 ? 0 : 1, px = 400 + col * 44, py = 460 + row * 110;
      const h = 0.7 + (f.total / maxT) * 0.75;

      place(new T.BoxGeometry(0.46, 0.34, 0.8), clay2, px, py, h + 0.17);
      place(cylY(0.09, 1.0, 14), clay, px, py, h + 0.8);

    /* pipe racks */
    place(new T.BoxGeometry(8.2, 0.08, 0.35), pipe, 512, 505, 0.95);

    for (let i = 0; i < 14; i++) place(new T.BoxGeometry(0.06, 0.95, 0.4), clay2, 350 + i * 28, 505, 0.47);
    /* compressors: halls with stepped roofs */
    [[640, 370], [690, 370], [640, 425], [690, 425]].forEach((p) => {
      place(new T.BoxGeometry(1.0, 0.65, 1.1), clay, p[0], p[1], 0.32);

    for (let i = 0; i < 9; i++) {
      const px = 240 + i * 26, py = 680;

    }

    [[600, 650], [650, 650]].forEach((p) => {
      place(new T.CylinderGeometry(0.42, 0.42, 1.2, 28).rotateZ(Math.PI / 2), clay, p[0], p[1], 0.55);
      place(new T.BoxGeometry(1.3, 0.18, 0.95), clay2, p[0], p[1], 0.09);

    for (let i = 0; i < 6; i++) {

    [[270, 390], [330, 370], [260, 460], [320, 450], [170, 420]].forEach((p, i) => {

      place(new T.CylinderGeometry(0.1, 0.8 - (i % 2) * 0.1, 0.14, 36), clay2, p[0], p[1], 0.82);

    anchor("Compressors", 700, 400, 1.2);
    anchor("Pumps", 300, 660, 0.5);
    anchor("Turbines", 625, 650, 1.1);
    anchor("Heat exchangers", 800, 530, 0.8);

    const render = (t) => {
      sx += (tx - sx) * 0.05;
      sy += (ty - sy) * 0.05;
      const k = base;
      camera.position.set((1.5 + sx * 1.6) * k, (25.5 + sy) * k, (18.5 + (reduce ? 0 : Math.sin(t * 0.00018) * 0.25)) * k);
      camera.lookAt(0.6, 0, 2.5);
      renderer.render(scene, camera);

      requestAnimationFrame(loop);
      if (running) render(t || 0);
    };
    canvas.addEventListener("pointermove", (e) => {
      const r = canvas.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
    });
    const api = {
      resize,
      project(name) {
        const a = anchors[name];
        if (!a) return null;
        a.getWorldPosition(v);
        v.project(camera);
        return { x: (v.x * 0.5 + 0.5) * dims.w, y: (-v.y * 0.5 + 0.5) * dims.h };
      },
      start() { running = true; resize(); },
      stop() { running = false; },
    };
    requestAnimationFrame(loop);
    return api;
  }

  window.SKScenes = { Machine, Plant, thumbs };
})();
