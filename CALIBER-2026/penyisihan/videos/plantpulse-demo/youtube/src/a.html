<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  body { background: #fff3ee; }
  .alarm { position: absolute; inset: 0; background:
    radial-gradient(900px 700px at 30% 60%, rgba(214,60,67,.55), transparent 70%),
    radial-gradient(700px 600px at 100% 0%, rgba(230,176,147,.8), transparent 70%),
    repeating-linear-gradient(-45deg, rgba(214,60,67,.06) 0 40px, transparent 40px 80px); }
  .machine { left: -60px; top: 330px; width: 1150px; transform: rotate(-3deg); }
  .waves { position: absolute; left: 330px; top: 470px; }
  .money { position: absolute; right: 70px; top: 90px; text-align: right; }
  .money .big { font: 700 250px/0.86 var(--display); letter-spacing: -0.06em; color: var(--danger); text-shadow: 0 8px 0 #7d1419, 0 30px 50px rgba(164,31,39,.45); }
  .money .gone { display: inline-block; margin-top: 26px; padding: 14px 34px 20px; background: var(--ink-hi); color: #fff; font: 700 150px/1 var(--display); letter-spacing: -0.05em; border-radius: 20px; transform: rotate(-3deg); box-shadow: 0 30px 60px -18px rgba(11,20,38,.6); }
  .q { position: absolute; right: 80px; top: 610px; font: 700 92px/1 var(--display); letter-spacing: -0.04em; color: var(--ink-hi); text-align: right; }
  .q em { font-style: normal; background: #ffd23f; padding: 0 16px; border-radius: 12px; box-shadow: 0 14px 30px -10px rgba(131,82,0,.5); }
  .trip { position: absolute; left: 70px; top: 90px; padding: 18px 30px; border-radius: 18px; background: var(--danger); color: #fff; font: 700 56px/1 var(--mono); letter-spacing: .12em; transform: rotate(-4deg); box-shadow: 0 0 0 10px rgba(214,60,67,.2), 0 30px 50px -14px rgba(164,31,39,.6); }
  .tag2 { position: absolute; left: 90px; top: 210px; font: 600 40px/1 var(--mono); color: var(--ink-hi); letter-spacing: .02em; background: #fff; padding: 14px 22px; border-radius: 14px; border: 2px solid rgba(24,38,72,.2); transform: rotate(-4deg); }
  .arrow { position: absolute; left: 640px; top: 330px; }
  .mascot { right: 560px; bottom: 30px; height: 300px; transform: rotate(10deg); }
  .wm { right: 80px; bottom: 60px; }
</style></head><body>
<div class="alarm"></div>
<svg class="machine" viewBox="0 0 1000 560"><!-- art:compressor:a --><!-- /art --></svg>
<svg class="waves" width="420" height="200" viewBox="0 0 420 200" fill="none" stroke="#d63c43" stroke-width="10" stroke-linecap="round">
  <path d="M20 40 q20 60 0 120"/><path d="M60 20 q30 80 0 160" opacity=".7"/><path d="M360 40 q-20 60 0 120"/><path d="M400 20 q-30 80 0 160" opacity=".7"/></svg>
<div class="trip">● TRIP</div>
<div class="tag2">KO-3201</div>
<div class="money"><div class="big">$1.58M</div><div class="gone">GONE.</div></div>
<div class="q">But <em>WHY?</em></div>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
</body></html>
