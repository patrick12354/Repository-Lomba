<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  .bg { position: absolute; inset: 0; background:
    radial-gradient(900px 700px at 25% 65%, rgba(29,154,99,.35), transparent 70%),
    radial-gradient(800px 700px at 100% 0%, rgba(163,206,255,.9), transparent 70%), #f6faf3; }
  .machine { left: -50px; top: 440px; width: 980px; }
  h1 { position: absolute; left: 70px; top: 60px; margin: 0; font: 700 170px/0.88 var(--display); letter-spacing: -0.055em; color: var(--ink-hi); }
  h1 em { font-style: normal; color: #fff; background: var(--ok); padding: 0 26px 14px; border-radius: 24px; display: inline-block; transform: rotate(-2deg); box-shadow: 0 30px 50px -16px rgba(13,106,66,.6); }
  .card { position: absolute; right: 70px; top: 300px; width: 820px; padding: 34px 40px; border-radius: 30px; background: #fff; border: 2px solid rgba(24,38,72,.14); box-shadow: 0 50px 90px -30px rgba(38,48,78,.5); transform: rotate(2deg); }
  .row { display: flex; align-items: center; gap: 26px; padding: 20px 0; border-bottom: 2px dashed rgba(24,38,72,.12); font: 700 54px/1 var(--display); letter-spacing: -0.03em; color: var(--ink-hi); }
  .row:last-child { border-bottom: 0; }
  .ck { flex: none; width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 46px; box-shadow: 0 10px 20px -6px rgba(13,106,66,.6); }
  .row small { display: block; margin-top: 8px; font: 500 28px/1 var(--mono); color: var(--ink-3); letter-spacing: 0; }
  .mascot { right: 60px; bottom: 20px; height: 250px; transform: rotate(8deg); }
  .wm { left: 74px; bottom: 50px; }
</style></head><body>
<div class="bg"></div>
<svg class="machine" viewBox="0 0 1000 560"><!-- art:compressor:d --><!-- /art --></svg>
<h1>Fix it.<br><em>PROVE it.</em></h1>
<div class="card">
  <div class="row"><div class="ck">✓</div><div>Root cause<small>ranked by AI, checked by Evidence Guard</small></div></div>
  <div class="row"><div class="ck">✓</div><div>Action + owner<small>due date, evidence required</small></div></div>
  <div class="row"><div class="ck">✓</div><div>Verified sign-off<small>reviewer is never the owner</small></div></div>
</div>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
</body></html>
