<!-- defaults: p=sina cls= w=260 smile=1 open=0 dot=1 -->
<svg class="sina {{cls}}" viewBox="-140 -150 280 290" width="{{w}}" overflow="visible" aria-hidden="true">
  <defs>
    <radialGradient id="{{p}}-body" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e3f2d8" />
      <stop offset=".55" stop-color="#aad39c" />
      <stop offset="1" stop-color="#6fa77a" />
    </radialGradient>
    <radialGradient id="{{p}}-nt" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffd2b5" />
      <stop offset=".6" stop-color="#f09a6c" />
      <stop offset="1" stop-color="#d9774a" />
    </radialGradient>
  </defs>
  <ellipse class="sina-shadow" cx="0" cy="122" rx="62" ry="9" fill="#10313a" opacity=".16" />
  <g class="sina-rig">
    <!-- dendrit atas: "rambut" neuron, tiap cabang bisa digoyang terpisah -->
    <g class="sina-dendrites" fill="none" stroke="#7fb88a" stroke-width="9" stroke-linecap="round">
      <g class="sina-d sina-d1"><path d="M-34,-56 C-46,-84 -34,-100 -58,-122" /><path d="M-44,-92 C-58,-96 -66,-92 -76,-100" stroke-width="6" /><circle cx="-58" cy="-122" r="8" fill="#aad39c" stroke="none" /><circle cx="-76" cy="-100" r="6" fill="#aad39c" stroke="none" /></g>
      <g class="sina-d sina-d2"><path d="M-2,-70 C4,-96 -8,-112 6,-136" /><circle cx="6" cy="-136" r="9" fill="#aad39c" stroke="none" /></g>
      <g class="sina-d sina-d3"><path d="M32,-58 C48,-82 40,-98 64,-114" /><path d="M46,-88 C60,-88 68,-80 80,-84" stroke-width="6" /><circle cx="64" cy="-114" r="8" fill="#aad39c" stroke="none" /><circle cx="80" cy="-84" r="6" fill="#aad39c" stroke="none" /></g>
      <g class="sina-d sina-d4"><path d="M-30,62 C-36,82 -28,96 -40,112" /><circle cx="-40" cy="112" r="7" fill="#aad39c" stroke="none" /></g>
      <g class="sina-d sina-d5"><path d="M30,62 C36,82 28,96 40,112" /><circle cx="40" cy="112" r="7" fill="#aad39c" stroke="none" /></g>
    </g>
    <!-- lengan = dendrit samping, origin di bahu -->
    <g class="sina-arm-l" fill="none" stroke="#7fb88a" stroke-width="10" stroke-linecap="round">
      <path d="M-62,6 C-84,14 -96,30 -108,48" /><circle cx="-108" cy="48" r="10" fill="#aad39c" stroke="none" />
    </g>
    <g class="sina-arm-r" fill="none" stroke="#7fb88a" stroke-width="10" stroke-linecap="round">
      <path d="M62,6 C84,14 96,30 108,48" /><circle cx="108" cy="48" r="10" fill="#aad39c" stroke="none" />
      <circle class="sina-dot" cx="112" cy="30" r="14" fill="url(#{{p}}-nt)" stroke="none" opacity="{{dot}}" />
    </g>
    <circle class="sina-body" r="74" fill="url(#{{p}}-body)" />
    <ellipse cx="-26" cy="-38" rx="22" ry="12" fill="#ffffff" opacity=".45" transform="rotate(-25 -26 -38)" />
    <g class="sina-face">
      <g class="sina-eye sina-eye-l" transform="translate(-25 -6)">
        <ellipse rx="15" ry="18" fill="#ffffff" />
        <g class="sina-pupil"><circle cx="2" cy="3" r="9" fill="#10313a" /><circle cx="6" cy="-2" r="3.4" fill="#ffffff" /></g>
        <ellipse class="sina-lid" rx="16.5" ry="19.5" fill="#98c78c" transform="scale(1 0)" />
      </g>
      <g class="sina-eye sina-eye-r" transform="translate(25 -6)">
        <ellipse rx="15" ry="18" fill="#ffffff" />
        <g class="sina-pupil"><circle cx="2" cy="3" r="9" fill="#10313a" /><circle cx="6" cy="-2" r="3.4" fill="#ffffff" /></g>
        <ellipse class="sina-lid" rx="16.5" ry="19.5" fill="#98c78c" transform="scale(1 0)" />
      </g>
      <ellipse cx="-46" cy="20" rx="11" ry="6" fill="#f09a6c" opacity=".55" />
      <ellipse cx="46" cy="20" rx="11" ry="6" fill="#f09a6c" opacity=".55" />
      <path class="sina-m sina-m-smile" d="M-14,24 Q0,38 14,24" fill="none" stroke="#10313a" stroke-width="5" stroke-linecap="round" opacity="{{smile}}" />
      <path class="sina-m sina-m-open" d="M-13,22 Q0,22 13,22 Q12,42 0,42 Q-12,42 -13,22 Z" fill="#10313a" opacity="{{open}}" />
    </g>
  </g>
</svg>
