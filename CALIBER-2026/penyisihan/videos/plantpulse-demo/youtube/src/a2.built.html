<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  body { background: #fff3ee; }
  .alarm { position: absolute; inset: 0; background:
    radial-gradient(900px 700px at 30% 60%, rgba(214,60,67,.55), transparent 70%),
    radial-gradient(700px 600px at 100% 0%, rgba(230,176,147,.8), transparent 70%),
    repeating-linear-gradient(-45deg, rgba(214,60,67,.06) 0 40px, transparent 40px 80px); }
  .machine { left: -60px; top: 330px; width: 1150px; transform: rotate(-3deg); }
  .waves { position: absolute; left: 330px; top: 470px; }
  .money { position: absolute; right: 70px; top: 90px; text-align: right; }
  .money .big { font: 700 250px/0.86 var(--display); letter-spacing: -0.06em; color: var(--danger); text-shadow: 0 8px 0 #7d1419, 0 30px 50px rgba(164,31,39,.45); }
  .money .gone { display: inline-block; margin-top: 26px; padding: 14px 34px 20px; background: var(--ink-hi); color: #fff; font: 700 150px/1 var(--display); letter-spacing: -0.05em; border-radius: 20px; transform: rotate(-3deg); box-shadow: 0 30px 60px -18px rgba(11,20,38,.6); }
  .q { position: absolute; right: 80px; top: 610px; font: 700 92px/1 var(--display); letter-spacing: -0.04em; color: var(--ink-hi); text-align: right; }
  .q em.g { background: var(--ok); color: #fff; box-shadow: 0 14px 30px -10px rgba(13,106,66,.6); }
  .q em { font-style: normal; background: #ffd23f; padding: 0 16px; border-radius: 12px; box-shadow: 0 14px 30px -10px rgba(131,82,0,.5); }
  .trip { position: absolute; left: 70px; top: 90px; padding: 18px 30px; border-radius: 18px; background: var(--danger); color: #fff; font: 700 56px/1 var(--mono); letter-spacing: .12em; transform: rotate(-4deg); box-shadow: 0 0 0 10px rgba(214,60,67,.2), 0 30px 50px -14px rgba(164,31,39,.6); }
  .tag2 { position: absolute; left: 90px; top: 210px; font: 600 40px/1 var(--mono); color: var(--ink-hi); letter-spacing: .02em; background: #fff; padding: 14px 22px; border-radius: 14px; border: 2px solid rgba(24,38,72,.2); transform: rotate(-4deg); }
  .arrow { position: absolute; left: 640px; top: 330px; }
  .mascot { right: 560px; bottom: 30px; height: 300px; transform: rotate(10deg); }
  .wm { right: 80px; bottom: 60px; }
</style></head><body>
<div class="alarm"></div>
<svg class="machine" viewBox="0 0 1000 560"><!-- Cracked gas compressor train, side elevation, drawn as navy ink on paper (1000 x 560 units).
     Shared by s00/s01/s03 via scripts/inline-art.mjs; a becomes the scene's id prefix.
     Parts with ids are animated by the scenes: pipes' flow dashes, the turning shaft stripes, the DE bearing
     (where vibration is measured), the status lamp, and the label layer. -->
<defs>
  <clipPath id="a-cpl-clip"><rect x="532" y="304" width="96" height="52" rx="10" /></clipPath>
  <clipPath id="a-shaft-clip"><rect x="512" y="320" width="120" height="20" /></clipPath>
  <linearGradient id="a-casing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f6fb" /><stop offset="0.45" stop-color="#e1e8f3" /><stop offset="1" stop-color="#c3cfe2" /></linearGradient>
  <linearGradient id="a-motor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe3f0" /><stop offset="0.5" stop-color="#c4d0e3" /><stop offset="1" stop-color="#a9b8d0" /></linearGradient>
  <linearGradient id="a-pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9d3e4" /><stop offset="0.4" stop-color="#eef2f8" /><stop offset="1" stop-color="#b9c5d9" /></linearGradient>
  <linearGradient id="a-pipeh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f8" /><stop offset="0.6" stop-color="#d3dbe8" /><stop offset="1" stop-color="#b9c5d9" /></linearGradient>
  <pattern id="a-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f0a21a" /><rect width="4" height="10" fill="#e08f0a" /></pattern>
</defs>
<g class="ink" stroke="#15213a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- process piping: gas in (suction, left) and gas out (discharge, right) rising off the top -->
  <g id="a-pipes">
    <path d="M 190 238 L 190 120 Q 190 70 140 70 L -40 70" fill="none" stroke="#15213a" stroke-width="64" />
    <path d="M 190 238 L 190 120 Q 190 70 140 70 L -40 70" fill="none" stroke="url(#a-pipe)" stroke-width="58" />
    <path d="M 380 238 L 380 160 Q 380 110 430 110 L 1040 110" fill="none" stroke="#15213a" stroke-width="56" />
    <path d="M 380 238 L 380 160 Q 380 110 430 110 L 1040 110" fill="none" stroke="url(#a-pipeh)" stroke-width="50" />
    <rect x="150" y="196" width="80" height="16" rx="3" fill="#b4c1d6" /><rect x="344" y="196" width="72" height="16" rx="3" fill="#b4c1d6" />
  </g>
  <!-- flow dashes ride inside the pipes (scenes animate stroke-dashoffset) -->
  <path id="a-flow-in" d="M -40 70 L 140 70 Q 190 70 190 120 L 190 230" fill="none" stroke="#2f62e0" stroke-width="6" stroke-dasharray="18 26" opacity="0.75" />
  <path id="a-flow-out" d="M 380 230 L 380 160 Q 380 110 430 110 L 1040 110" fill="none" stroke="#2f62e0" stroke-width="6" stroke-dasharray="18 26" opacity="0.75" />

  <!-- baseplate / skid -->
  <rect x="40" y="452" width="900" height="44" rx="6" fill="#8b98ae" />
  <rect x="40" y="452" width="900" height="10" rx="4" fill="#a6b2c5" stroke="none" />
  <g fill="#15213a" stroke="none"><circle cx="80" cy="478" r="6" /><circle cx="300" cy="478" r="6" /><circle cx="520" cy="478" r="6" /><circle cx="700" cy="478" r="6" /><circle cx="900" cy="478" r="6" /></g>

  <!-- NDE bearing pedestal (left) -->
  <rect x="58" y="300" width="58" height="64" rx="8" fill="#aebbd2" />
  <rect x="68" y="364" width="38" height="88" fill="#97a5bd" />

  <!-- compressor casing: barrel with end covers, horizontal split line and bolts -->
  <rect x="112" y="226" width="22" height="214" rx="6" fill="#b9c6da" />
  <rect x="446" y="226" width="22" height="214" rx="6" fill="#b9c6da" />
  <rect x="130" y="236" width="320" height="194" rx="26" fill="url(#a-casing)" />
  <path d="M 132 333 L 448 333" stroke-width="2.5" />
  <g fill="#15213a" stroke="none"><circle cx="160" cy="333" r="5" /><circle cx="200" cy="333" r="5" /><circle cx="240" cy="333" r="5" /><circle cx="280" cy="333" r="5" /><circle cx="320" cy="333" r="5" /><circle cx="360" cy="333" r="5" /><circle cx="400" cy="333" r="5" /><circle cx="430" cy="333" r="5" /></g>
  <path d="M 150 252 L 430 252" stroke="#ffffff" stroke-width="5" opacity="0.8" />
  <rect x="170" y="430" width="40" height="22" fill="#97a5bd" /><rect x="370" y="430" width="40" height="22" fill="#97a5bd" />

  <!-- DE bearing housing with its vibration probe (the measurement point in the data) -->
  <g id="a-bearing">
    <rect x="466" y="292" width="62" height="80" rx="9" fill="#aebbd2" />
    <rect x="476" y="372" width="42" height="80" fill="#97a5bd" />
    <rect x="490" y="262" width="14" height="30" rx="3" fill="#15213a" />
    <path d="M 497 262 Q 497 236 530 232" fill="none" stroke-width="3" />
  </g>

  <!-- shaft + coupling under its guard; the stripes slide to show the shaft turning -->
  <rect x="512" y="320" width="120" height="20" fill="#c2ccdc" />
  <g clip-path="url(#a-shaft-clip)"><g id="a-shaft-stripes" stroke="none" fill="#8d9ab0">
    <rect x="512" y="300" width="120" height="6" /><rect x="512" y="316" width="120" height="6" /><rect x="512" y="332" width="120" height="6" /><rect x="512" y="348" width="120" height="6" />
  </g></g>
  <rect x="532" y="304" width="96" height="52" rx="10" fill="url(#a-hatch)" />
  <g clip-path="url(#a-cpl-clip)" opacity="0.55"><g id="a-cpl-stripes" stroke="none" fill="#ffffff">
    <rect x="532" y="276" width="96" height="5" /><rect x="532" y="294" width="96" height="5" /><rect x="532" y="312" width="96" height="5" /><rect x="532" y="330" width="96" height="5" /><rect x="532" y="348" width="96" height="5" />
  </g></g>
  <rect x="532" y="304" width="96" height="52" rx="10" fill="none" />

  <!-- electric motor: finned body, terminal box, fan cowl, feet -->
  <rect x="628" y="246" width="250" height="184" rx="22" fill="url(#a-motor)" />
  <g stroke-width="2" opacity="0.55"><path d="M 660 262 L 660 414" /><path d="M 690 262 L 690 414" /><path d="M 720 262 L 720 414" /><path d="M 750 262 L 750 414" /><path d="M 780 262 L 780 414" /><path d="M 810 262 L 810 414" /><path d="M 840 262 L 840 414" /></g>
  <path d="M 878 270 L 912 282 Q 924 338 912 394 L 878 406 Z" fill="#b2bfd5" />
  <rect x="706" y="206" width="96" height="40" rx="6" fill="#b4c1d6" />
  <rect x="650" y="430" width="44" height="22" fill="#97a5bd" /><rect x="812" y="430" width="44" height="22" fill="#97a5bd" />
  <!-- status lamp on the terminal box -->
  <rect x="746" y="182" width="16" height="24" fill="#97a5bd" stroke-width="2.5" />
  <circle id="a-lamp" cx="754" cy="172" r="15" fill="#d63c43" />
  <circle id="a-lamp-glow" cx="754" cy="172" r="15" fill="none" stroke="#1d9a63" stroke-width="3" opacity="0" />
</g>
</svg>
<svg class="waves" width="420" height="200" viewBox="0 0 420 200" fill="none" stroke="#d63c43" stroke-width="10" stroke-linecap="round">
  <path d="M20 40 q20 60 0 120"/><path d="M60 20 q30 80 0 160" opacity=".7"/><path d="M360 40 q-20 60 0 120"/><path d="M400 20 q-30 80 0 160" opacity=".7"/></svg>
<div class="trip">● TRIP</div>
<div class="tag2">KO-3201</div>
<div class="money"><div class="big">$1.58M</div><div class="gone">GONE.</div></div>
<div class="q">Here’s the <em class="g">FIX.</em></div>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
</body></html>
