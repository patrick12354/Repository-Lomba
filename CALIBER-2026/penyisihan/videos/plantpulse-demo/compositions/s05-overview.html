          tl.to("#s05-scrim", { opacity: 1, duration: 0.6 }, 3.0);

          tl.fromTo("#s05-c2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 4.65);
          tl.fromTo("#s05-c3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 6.1);
          [["s05-n1", 380, 3.05], ["s05-n2", 12, 4.65], ["s05-n3", 5, 6.1]].forEach(([id, n, t]) => {

          tl.to(cam, { x: -390, y: -500, scale: 1.24, duration: 2.9, ease: "none" }, 4.1);

          tl.to("#s05-scrim", { opacity: 0, duration: 0.35 }, 6.95);
          tl.to(cam, { x: -560, y: -548, scale: 2.4, duration: 0.95, ease: "power3.inOut" }, 7.0);
          tl.fromTo("#s05-bs", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.9);
          tl.fromTo("#s05-k1", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 7.98);
