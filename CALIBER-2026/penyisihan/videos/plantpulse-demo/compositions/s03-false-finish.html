      <script>
        (() => {
          const $ = (id) => document.getElementById(id);
          const RUN = 2.0;
          const flowIn = $("s03-flow-in"), flowOut = $("s03-flow-out"), sh = $("s03-shaft-stripes"), cp = $("s03-cpl-stripes"), lamp = $("s03-lamp"), glow = $("s03-lamp-glow");
          // spin-up from RUN: rotation accelerates over 0.8 s, then turns at full speed
          const rot = (t) => { const u = t - RUN; return u <= 0 ? 0 : u < 0.8 ? u * u / 1.6 : 0.4 + (u - 0.8); };
          const sim = (t) => {
            const R = rot(t);
            flowIn.style.strokeDashoffset = -R * 90; flowOut.style.strokeDashoffset = -R * 90;
            sh.setAttribute("transform", `translate(0 ${(R * 160) % 16})`); cp.setAttribute("transform", `translate(0 ${(R * 160) % 18})`);
            const c = t >= RUN ? "#1d9a63" : "#d63c43";
            lamp.setAttribute("fill", c); glow.setAttribute("stroke", c);
            const b = t < RUN ? 0.5 + 0.5 * Math.sin(t * 12) : 0;
            glow.setAttribute("opacity", b.toFixed(3)); glow.setAttribute("r", (15 + b * 14).toFixed(1));
          };
          const clock = { t: 0 };
          sim(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: 8.6, duration: 8.6, ease: "none", onUpdate: () => sim(clock.t) }, 0);
          tl.set("#s03-machine-body", { filter: "saturate(0.35)" }, 0);
