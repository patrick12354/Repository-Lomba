      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // Slow push for the whole scene so the hold never goes dead.
          tl.fromTo("#s12-stage", { scale: 1 }, { scale: 1.03, duration: 10.4, ease: "none" }, 0);
          tl.fromTo("#s12-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 0);
          // Back light and floor pool come up as the mascot walks into its mark (arrives ~2.6 s).
          tl.fromTo("#s12-halo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 1.4);
          tl.fromTo("#s12-pool", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 1.2, ease: "expo.out" }, 1.9);
          // The case tag returns one last time, band lit: evidence required.
          tl.fromTo("#s12-tag", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.15);
          // "PlantPulse.": the tag flips away and the logo wordmark wipes in where it stood, a pulse runs under it.
          tl.to("#s12-tag", { rotationY: 90, scale: 0.7, opacity: 0, duration: 0.45, ease: "power2.in" }, 1.0);
          tl.fromTo("#s12-wm", { clipPath: "inset(0% 100% 0% 0%)", x: -24 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.75, ease: "expo.out" }, 1.38);
          tl.fromTo("#s12-wm", { filter: "drop-shadow(0 0 0px rgba(47,98,224,0))" }, { filter: "drop-shadow(0 6px 22px rgba(47,98,224,0.35))", duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 1.45);
          tl.fromTo("#s12-pulse", { strokeDasharray: 760, strokeDashoffset: 760 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 1.5);
          // The rule, word by word on the voice.
          const at = [1.833,2.089,2.216,2.762,2.971,3.168,3.285]; // voAt 0.8 + word starts of 12-lockup
          document.querySelectorAll("#s12-line .w").forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, at[i] - 0.05));
          tl.fromTo("#s12-foot > *", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.2 }, 5.4);
          // The mascot jumps (~8.15-8.7 s): the floor pool shrinks under it, then a ring and sparks on landing.
          tl.to("#s12-pool", { scaleX: 0.7, opacity: 0.6, duration: 0.25, ease: "power2.out" }, 8.2);
          tl.to("#s12-pool", { scaleX: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 8.68);
          tl.fromTo("#s12-land", { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.9, duration: 0.7, ease: "expo.out", immediateRender: false }, 8.68);
          ["#s12-sp1", "#s12-sp2", "#s12-sp3", "#s12-sp4"].forEach((s, i) => {
            const t0 = 8.32 + i * 0.07;
            tl.fromTo(s, { opacity: 0, scale: 0, rotation: -45 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2.4)" }, t0);
            tl.to(s, { opacity: 0, scale: 0.4, rotation: 45, duration: 0.4, ease: "power2.in" }, t0 + 0.45);
          });
          tl.to("#s12-black", { opacity: 1, duration: 0.65, ease: "power2.in" }, 10.3);
          window.__timelines["s12-lockup"] = tl;
        })();
      </script>
