          document.getElementById("s01-g-red").setAttribute("d", arc(75.4, 90, 196));
          const ticks = document.getElementById("s01-g-ticks");
          for (let v = 20; v <= 90; v += 10) { const a = ang(v), l = document.createElementNS("http://www.w3.org/2000/svg", "line");
            l.setAttribute("x1", (Math.sin(a) * 172).toFixed(1)); l.setAttribute("y1", (-Math.cos(a) * 172).toFixed(1)); l.setAttribute("x2", (Math.sin(a) * 158).toFixed(1)); l.setAttribute("y2", (-Math.cos(a) * 158).toFixed(1)); ticks.appendChild(l); }
          [["s01-z1", 32], ["s01-z2", 60], ["s01-z3", 83]].forEach(([id, v]) => { const a = ang(v), t = document.getElementById(id); t.setAttribute("x", (Math.sin(a) * 240).toFixed(1)); t.setAttribute("y", (-Math.cos(a) * 240 + 6).toFixed(1)); });
          // weekly trace
          const X = (i) => i * 26, Y = (v) => (75 - v) * 2.4;
          const pts = V.map((v, i) => [X(i), Y(v)]);
          document.getElementById("s01-line").setAttribute("d", "M" + pts.map((p) => p.join(",")).join(" L"));

          const $ = (id) => document.getElementById(id);
          const shake = $("s01-shake"), needle = $("s01-needle"), val = $("s01-val"), when = $("s01-when"), head = $("s01-head"), rev = $("s01-reveal-rect"), line = $("s01-line");
          const flowIn = $("s01-flow-in"), flowOut = $("s01-flow-out"), sh = $("s01-shaft-stripes"), cp = $("s01-cpl-stripes"), lamp = $("s01-lamp"), glow = $("s01-lamp-glow");
          const W = [0, 1, 2, 3, 4, 5].map((k) => $("s01-wv" + k));
          const week = (t) => t <= T0 ? 0 : t >= TRIP ? 20 : ((t - T0) / (TRIP - T0)) * 20;
          const vib = (w) => { const i = Math.min(19, Math.floor(w)), f = w - i; return V[i] + (V[i + 1] - V[i]) * f; };
          const rot = (t) => t < STOP ? t : t < STOP + SPIN ? STOP + (t - STOP) - (t - STOP) ** 2 / (2 * SPIN) : STOP + SPIN / 2;
          const amp = (t, v) => t < TRIP ? 0.3 + ((v - 27) / 49.5) * 5.2 : t < STOP ? 9 : t < STOP + SPIN ? 9 * (1 - (t - STOP) / SPIN) ** 2 : 0;
          const sim = (t) => {
            const w = week(t), v = vib(w), i = Math.round(w), A = amp(t, v);
            shake.setAttribute("transform", `translate(${(A * (0.6 * Math.sin(t * 71) + 0.4 * Math.sin(t * 113))).toFixed(2)} ${(A * 0.45 * Math.sin(t * 89)).toFixed(2)})`);
            const R = rot(t);
            flowIn.style.strokeDashoffset = -R * 90; flowOut.style.strokeDashoffset = -R * 90;
            sh.setAttribute("transform", `translate(0 ${(R * 160) % 16})`); cp.setAttribute("transform", `translate(0 ${(R * 160) % 18})`);
            // vibration rings off the bearing, stronger as it shakes
            const k = Math.min(1, A / 6);
            for (let n = 0; n < 3; n++) {
              const ph = (t * 1.7 + n / 3) % 1, r = 70 + ph * 70, o = (1 - ph) * k;
              for (const [s, el] of [[-1, W[n]], [1, W[n + 3]]]) {
                const a0 = (s > 0 ? -35 : 145) * Math.PI / 180, a1 = (s > 0 ? 35 : 215) * Math.PI / 180, cx = 497, cy = 330;
                el.setAttribute("d", `M ${(cx + Math.cos(a0) * r).toFixed(1)} ${(cy + Math.sin(a0) * r).toFixed(1)} A ${r} ${r} 0 0 1 ${(cx + Math.cos(a1) * r).toFixed(1)} ${(cy + Math.sin(a1) * r).toFixed(1)}`);
                el.setAttribute("opacity", o.toFixed(3));
                el.setAttribute("stroke", t >= TRIP ? "#d63c43" : v >= 45 ? "#d48a06" : "#2f62e0");
              }
            }
            // gauge + readout + trace follow the week
            const jit = t >= TRIP && t < STOP + 0.4 ? 2.2 * Math.sin(t * 61) : 0;
            needle.setAttribute("transform", `rotate(${(ang(v) * 180 / Math.PI + jit).toFixed(2)})`);
            val.textContent = v.toFixed(1) + " µm";
            val.style.color = v >= 75 ? "#d63c43" : v >= 45 ? "#b06f00" : "#0b1426";
            if (t < 4.75) when.textContent = "WEEK OF " + D[Math.min(20, i)];
            rev.setAttribute("width", (X(w) + 12).toFixed(1));
            const hp = [X(w), Y(v)];
            head.setAttribute("cx", hp[0].toFixed(1)); head.setAttribute("cy", hp[1].toFixed(1));
            const c = v >= 75 ? "#d63c43" : v >= 45 ? "#d48a06" : "#2f62e0";
            head.setAttribute("fill", c); line.setAttribute("stroke", c);
            // status lamp: green -> amber at alarm -> blinking red after the trip
            const lc = t >= TRIP ? "#d63c43" : v >= 45 ? "#e0a028" : "#1d9a63";
            lamp.setAttribute("fill", lc); glow.setAttribute("stroke", lc);
            const blink = t >= TRIP ? 0.5 + 0.5 * Math.sin(t * 12) : 0;
            glow.setAttribute("opacity", blink.toFixed(3)); glow.setAttribute("r", (15 + blink * 14).toFixed(1));
          };
          const clock = { t: 0 };
          sim(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: 15.3, duration: 15.3, ease: "none", onUpdate: () => sim(clock.t) }, 0);

          tl.fromTo("#s01-grid", { opacity: 0 }, { opacity: 0.45, duration: 1.0 }, 0);
          tl.fromTo("#s01-art", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.8, ease: "expo.out" }, 0);
          tl.fromTo("#s01-kicker, #s01-srcchip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.12 }, 0.3);
          tl.fromTo("#s01-when", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.45);
          tl.fromTo("#s01-gauge", { opacity: 0, scale: 0.85, transformOrigin: "1495px 420px" }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.35);
          tl.fromTo("#s01-read", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.6);
          tl.fromTo("#s01-chart", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.8);
          tl.fromTo("#s01-probe-lbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.4);
          tl.to("#s01-probe-lbl", { opacity: 0, duration: 0.4 }, 4.6);
          // "On April twenty-ninth, twenty twenty-six"
          tl.set("#s01-when", { textContent: "29 APR 2026", className: "when big" }, 4.75);
          tl.fromTo("#s01-when", { scale: 1.25 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 4.75);
          // "crossed its safety limit": flash, needle into the red, limit chip
          tl.fromTo("#s01-flash", { opacity: 0 }, { opacity: 1, duration: 0.06 }, TRIP);
          tl.to("#s01-flash", { opacity: 0.22, duration: 1.4, ease: "power2.out" }, TRIP + 0.08);
          tl.fromTo("#s01-crossed", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, TRIP + 0.05);
          // "and shut itself down": the machine spins down and greys; the case tag lands
          tl.to("#s01-machine-body", { filter: "saturate(0.35)", duration: 1.2, ease: "power2.out" }, STOP + 0.2);
          tl.to("#s01-gauge, #s01-read, #s01-chart, #s01-crossed, #s01-when", { opacity: 0, y: 40, duration: 0.4, ease: "power2.in", stagger: 0.03 }, 8.9);
          tl.fromTo("#s01-tag", { opacity: 0, scale: 1.35, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.in" }, 9.0);
          tl.fromTo("#s01-band", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, 9.34);
          tl.fromTo("#s01-date", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 9.3);
          // "Thirty-two hours offline": the clock races
          tl.fromTo("#s01-st1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 9.8);
          tl.fromTo("#s01-mh", { rotation: 0, svgOrigin: "28 28" }, { rotation: 720 * 1.5, svgOrigin: "28 28", duration: 1.6, ease: "power2.inOut" }, 9.9);
          tl.fromTo("#s01-hh", { rotation: 0, svgOrigin: "28 28" }, { rotation: 90, svgOrigin: "28 28", duration: 1.6, ease: "power2.inOut" }, 9.9);
          // "One point five eight million dollars of recorded loss"
          tl.fromTo("#s01-st2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 11.55);
          const loss = { v: 0 };
          tl.to(loss, { v: 1584000, duration: 1.8, ease: "power3.out", onUpdate: () => { $("s01-loss").textContent = "US$" + Math.round(loss.v).toLocaleString("en-US"); } }, 11.6);
          // Hand-off: everything clears, the tag travels to centre for the next scene.
          tl.to("#s01-stats, #s01-date", { opacity: 0, y: 30, duration: 0.4, ease: "power2.in" }, 14.35);
          tl.to("#s01-art, #s01-kicker, #s01-srcchip, #s01-grid", { opacity: 0, x: -60, duration: 0.6, ease: "power2.in", stagger: 0.03 }, 14.4);
          tl.to("#s01-flash", { opacity: 0, duration: 0.6 }, 14.45);
          tl.to("#s01-tag", { x: 700 - 1250, y: 390 - 200, duration: 0.85, ease: "power3.inOut" }, 14.45);
          // time-warp (written by scripts/warp.mjs): [authored s, current s] anchors through every spoken word.
          const WARP = [[0,0],[0.3,0.3],[0.625,0.555],[2.738,1.252],[2.959,1.554],[3.11,1.763],[3.284,1.96],[3.679,2.39],[3.771,2.506],[4.05,2.785],[4.921,4.538],[6.999,5.06],[7.475,5.466],[7.614,5.606],[7.997,5.966],[8.322,6.395],[8.531,6.604],[8.764,6.836],[9.135,7.254],[9.878,7.661],[10.412,8.16],[10.784,8.555],[11.608,9.809],[11.84,10.087],[12.699,10.795],[13.001,11.213],[14.557,12.467],[15.3,13.21]];
          window.__timelines["s01-trip"] = ((src, P) => {
            const end = P[P.length - 1];
            const back = (t) => { for (let i = 1; i < P.length; i++) if (t <= P[i][1]) { const [a0, b0] = P[i - 1], [a1, b1] = P[i]; return a0 + (a1 - a0) * ((t - b0) / (b1 - b0)); } return end[0]; };
            const w = gsap.timeline({ paused: true });
            w.fromTo(src, { time: 0 }, { time: end[0], duration: end[1], ease: (p) => back(p * end[1]) / end[0], immediateRender: true });
            return w;
          })(tl, WARP);
        })();
      </script>
    </template>
