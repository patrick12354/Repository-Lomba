<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  body { background: #0b1426; }
  .p { position: absolute; top: 0; height: 1080px; overflow: hidden; }
  .p1 { left: -40px; width: 720px; clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); background: radial-gradient(500px 500px at 50% 62%, rgba(214,60,67,.55), transparent 75%), #fff0ea; }
  .p2 { left: 616px; width: 720px; clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%); background: radial-gradient(500px 500px at 50% 62%, rgba(212,138,6,.35), transparent 75%), #fbf6e6; }
  .p3 { left: 1272px; width: 690px; clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%); background: radial-gradient(520px 520px at 50% 62%, rgba(29,154,99,.5), transparent 75%), #ecf8f0; }
  .machine { width: 600px; top: 540px; }
  .glass { position: absolute; left: 0; top: 0; z-index: 3; }
  .p .pill { z-index: 2; }
  .m1 { left: 40px; transform: rotate(-5deg); }
  .m2 { left: 50px; }
  .m3 { left: 70px; }
  .h { position: absolute; top: 56px; font: 700 128px/0.88 var(--display); letter-spacing: -0.055em; }
  .h1 { left: 50px; color: var(--danger); text-shadow: 0 6px 0 #7d1419; }
  .h2 { left: 730px; color: var(--ink-hi); }
  .h3 { left: 1400px; color: var(--ok); text-shadow: 0 6px 0 #0a4d30; }
  .n { position: absolute; top: 330px; font: 600 30px/1 var(--mono); letter-spacing: .14em; color: var(--ink-3); }
  .pill { position: absolute; top: 380px; padding: 12px 22px; border-radius: 999px; font: 700 36px/1 var(--mono); letter-spacing: .1em; color: #fff; }
  .pt { left: 54px; background: var(--danger); transform: rotate(-4deg); box-shadow: 0 0 0 8px rgba(214,60,67,.2); }
  .pr { left: 740px; background: var(--ok); z-index: 2; }
  .pv { left: 1404px; background: var(--ok); box-shadow: 0 0 0 8px rgba(29,154,99,.22); }
  .crack { position: absolute; left: 600px; top: 0; width: 760px; height: 1080px; pointer-events: none; }
  .tape { position: absolute; left: 520px; top: 700px; width: 940px; z-index: 5; padding: 26px 0; text-align: center; transform: rotate(-11deg);
    background: repeating-linear-gradient(-45deg, #d63c43 0 34px, #c1313a 34px 68px); color: #fff; font: 700 56px/1 var(--display); letter-spacing: -0.02em;
    box-shadow: 0 0 0 6px #fff, 0 40px 70px -20px rgba(11,20,38,.7); text-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .mascot { left: 1690px; top: 830px; height: 230px; transform: rotate(-8deg); z-index: 6; }
  .wm { left: 1400px; bottom: 40px; font-size: 50px; }
</style></head><body>
<div class="p p1"><svg class="machine m1" viewBox="0 0 1000 560"><!-- art:compressor:c1 --><!-- /art --></svg></div>
<div class="p p2"><svg class="machine m2" viewBox="0 0 1000 560"><!-- art:compressor:c2 --><!-- /art --></svg><svg id="glass" class="glass" width="720" height="1080"></svg></div>
<div class="p p3"><svg class="machine m3" viewBox="0 0 1000 560"><!-- art:compressor:c3 --><!-- /art --></svg></div>
<div class="h h1">$1.58M<br>LOST</div>
<div class="h h2">FIXED?</div>
<div class="h h3">FIXED.<br>PROVEN.</div>
<div class="pill pt">● TRIP</div><div class="pill pr">✓ REPAIRED</div><div class="pill pv">✓ VERIFIED</div>
<div class="tape">THE EVIDENCE SAYS OTHERWISE</div>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
<script>
  // Shattered-glass impact on the REPAIRED pill (deterministic).
  let q = 11; const r = () => (q = (q * 9301 + 49297) % 233280) / 233280;
  const cx = 272, cy = 410, N = 11, rays = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + (r() - 0.5) * 0.35, len = 220 + r() * 420, pts = [[cx, cy]];
    for (let d = 40; d < len; d += 36 + r() * 30) { const j = (r() - 0.5) * 0.22; pts.push([cx + Math.cos(a + j) * d, cy + Math.sin(a + j) * d]); }
    rays.push(pts);
  }
  const ring = (rad) => rays.map(p => { const k = Math.min(p.length - 1, Math.round(rad / 52)); return p[k]; });
  const path = (pts, close) => "M" + pts.map(p => p.map(v => v.toFixed(1)).join(" ")).join(" L") + (close ? " Z" : "");
  let d = rays.map(p => path(p)).join(" ") + " " + path(ring(70), true) + " " + path(ring(160), true);
  const shards = [0, 3, 7].map(i => { const a = ring(70)[i], b = ring(70)[(i + 1) % N], c = ring(160)[(i + 1) % N], e = ring(160)[i]; return `<path d="${path([a, b, c, e], true)}" fill="rgba(255,255,255,.55)"/>`; }).join("");
  document.getElementById("glass").innerHTML = shards +
    `<path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>` +
    `<path d="${d}" fill="none" stroke="#0b1426" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${cx}" cy="${cy}" r="16" fill="#fff" stroke="#0b1426" stroke-width="3"/>`;
</script>
</body></html>
