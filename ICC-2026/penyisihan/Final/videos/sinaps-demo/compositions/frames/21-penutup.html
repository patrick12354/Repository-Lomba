<!-- @sfx shimmer_sweep@0.0:0.4 swish_fast@0.4:0.4 hop@0.65:0.45 punch_hit@~SINAPS-0.2:0.45 success_arp@~SINAPS:0.4 clap@2.25:0.65 confetti@2.25:0.5 sparkle@2.3:0.4 snap@~Latihan-0.1:0.35 mar3@~umpan:0.4 notif_pop@~dipercaya:0.5 glass_hi@~dipercaya+0.5:0.4 ui_swell@~dipercaya+0.7:0.35 -->
<script>
(() => {
  // ---- helper bersama (disisipkan tools/build.mjs) ----
  // T0 = waktu nominal mulai frame di timeline lokal (0,5 dtk pertama dipakai transisi masuk)
  const ID = "f21", T0 = 0.5, DUR = 10.5, VO_AT = 0.6, VOW = [["SINAPS",0],["Latihan",1.16],["membaca",1.52],["MRI",2.08],["stroke",2.72],["kapan",3.48],["saja",3.84],["dengan",4.64],["umpan",4.88],["balik",5.12],["yang",5.56],["bisa",5.76],["dipercaya",6.08]];
  const END = T0 + DUR;
  const R = document.getElementById(ID);
  const S = R.querySelector(".scene");
  const $ = (q) => R.querySelectorAll(q);
  const $1 = (q) => R.querySelector(q);
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out", duration: 0.6 } });
  // selector string GSAP dicari di seluruh halaman gabungan; batasi ke frame ini
  const scope = (t) => (typeof t === "string" ? R.querySelectorAll(t) : t);
  for (const m of ["to", "from", "fromTo", "set"]) {
    const orig = tl[m].bind(tl);
    tl[m] = (t, ...a) => orig(scope(t), ...a);
  }
  // waktu (lokal) kata ke-n di voiceover frame ini yang cocok dengan pola
  const w = (pat, n = 1) => {
    const re = new RegExp(pat, "i");
    let c = 0;
    for (const [t, s] of VOW) if (re.test(t) && ++c === n) return T0 + VO_AT + s;
    throw new Error(`${ID}: kata "${pat}" (#${n}) tidak ada di VO`);
  };
  const fmtID = (v, dec = 0) => {
    const [i, f] = v.toFixed(dec).split(".");
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : "");
  };
  // transisi masuk: iris (lingkaran dari titik), push (geser dari kanan), fade (blur crossfade), none
  const enter = (kind, x = 960, y = 540) => {
    if (kind === "none" || T0 === 0) return;
    const d = 0.62;
    if (kind === "iris") {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 1920 1080");
      Object.assign(svg.style, { position: "absolute", inset: "0", width: "100%", height: "100%", pointerEvents: "none", zIndex: 50 });
      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", x); ring.setAttribute("cy", y); ring.setAttribute("r", 0);
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#e07a1f"); ring.setAttribute("stroke-width", "14");
      svg.appendChild(ring);
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", 0); dot.setAttribute("fill", "#f09a6c");
      svg.appendChild(dot);
      R.appendChild(svg);
      tl.fromTo(dot, { attr: { r: 0 } }, { attr: { r: 26 }, duration: 0.14, ease: "back.out(3)" }, 0);
      tl.to(dot, { attr: { r: 0 }, duration: 0.18, ease: "power2.in" }, 0.16);
      tl.fromTo(S, { clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(2300px at ${x}px ${y}px)`, duration: d, ease: "power3.inOut" }, 0.1);
      tl.fromTo(ring, { attr: { r: 0 }, opacity: 1 }, { attr: { r: 2300 }, duration: d, ease: "power3.inOut" }, 0.1);
      tl.set(S, { clipPath: "none" }, 0.1 + d);
      tl.set(svg, { opacity: 0 }, 0.1 + d);
    } else if (kind === "push") {
      tl.fromTo(S, { x: 1920, boxShadow: "-40px 0 80px rgba(16,24,40,.18)" }, { x: 0, duration: d, ease: "power3.inOut" }, 0);
      tl.set(S, { boxShadow: "none" }, d);
    } else if (kind === "fade") {
      tl.fromTo(S, { opacity: 0, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: d, ease: "sine.inOut" }, 0);
      tl.set(S, { filter: "none" }, d);
    } else if (kind === "bars") {
      // lima batang warna merek naik menutup layar, lalu terus naik membuka adegan baru
      const ov = overlay(52);
      const bs = ["#195764", "#e07a1f", "#aad39c", "#0f3a43", "#f09a6c"].map((c, i) => div(ov, { position: "absolute", top: "0", bottom: "0", left: `${i * 20}%`, width: "20.3%", background: c }));
      tl.set(S, { opacity: 0 }, 0);
      tl.fromTo(bs, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.26, ease: "power3.in", stagger: 0.035 }, 0);
      tl.set(S, { opacity: 1 }, 0.42);
      tl.to(bs, { scaleY: 0, transformOrigin: "50% 0%", duration: 0.32, ease: "power3.out", stagger: 0.035 }, 0.43);
      tl.set(ov, { display: "none" }, 0.95);
    } else if (kind === "zoom") {
      tl.fromTo(S, { opacity: 0, scale: 1.55, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.02);
      tl.set(S, { filter: "none" }, 0.6);
    } else if (kind === "whip") {
      tl.fromTo(S, { x: 1500, skewX: -10, filter: "blur(34px)" }, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);
      tl.set(S, { filter: "none" }, 0.52);
    } else if (kind === "slideup") {
      const ov = overlay(52);
      const p = div(ov, { position: "absolute", left: "0", right: "0", top: "0", height: "1080px", background: "#e07a1f" });
      tl.fromTo(p, { y: 1080 }, { y: -1080, duration: 0.62, ease: "power3.inOut" }, 0);
      tl.fromTo(S, { y: 1080 }, { y: 0, duration: 0.55, ease: "power4.inOut" }, 0.07);
      tl.set(ov, { display: "none" }, 0.7);
    } else if (kind === "glitch") {
      const ov = overlay(52);
      const strips = [0.12, 0.27, 0.41, 0.58, 0.7, 0.86].map((yy, i) => div(ov, { position: "absolute", left: "0", right: "0", top: `${yy * 100}%`, height: `${16 + (i % 3) * 22}px`, background: i % 2 ? "rgba(37,200,230,.75)" : "rgba(220,38,38,.75)", mixBlendMode: "multiply" }));
      tl.fromTo(S, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "steps(5)" }, 0);
      tl.fromTo(S, { x: -60, skewX: 16 }, { x: 0, skewX: 0, duration: 0.45, ease: "steps(6)" }, 0);
      strips.forEach((st, i) => tl.fromTo(st, { opacity: 0, x: (i % 2 ? 1 : -1) * 120 }, { opacity: 1, x: 0, duration: 0.05, yoyo: true, repeat: 7, ease: "steps(1)" }, i * 0.02));
      tl.set(ov, { display: "none" }, 0.6);
    }
  };
  // keluar: hanya saat frame berikutnya sedang masuk di atasnya (bukan exit sendiri)
  const leave = () => {
    tl.to(S, { scale: 0.965, filter: "blur(3px)", duration: 0.5, ease: "power2.in" }, END - 0.5);
  };
  const blink = (sel, times) => times.forEach((t) => {
    tl.to(R.querySelectorAll(sel), { scaleY: 1, duration: 0.07, ease: "none", transformOrigin: "50% 50%" }, t);
    tl.to(R.querySelectorAll(sel), { scaleY: 0, duration: 0.09, ease: "none" }, t + 0.1);
  });
  // gerak idle naik-turun yang terbatas (yoyo dengan repeat terhitung)
  const bob = (sel, from, to, amp = 8, per = 1.6, prop = "y") => {
    const n = Math.max(1, Math.floor((to - from) / (per / 2)) - 1);
    tl.fromTo(sel, { [prop]: 0 }, { [prop]: -amp, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n }, from);
  };
  const pop = (sel, t, o = {}) => tl.fromTo(sel, { scale: o.from ?? 0.6, opacity: 0, transformOrigin: o.origin ?? "50% 50%" }, { scale: 1, opacity: 1, duration: o.d ?? 0.5, ease: o.ease ?? "back.out(2)", stagger: o.stagger ?? 0 }, t);
  const rise = (sel, t, o = {}) => tl.fromTo(sel, { y: o.y ?? 40, opacity: 0 }, { y: 0, opacity: 1, duration: o.d ?? 0.6, ease: o.ease ?? "power3.out", stagger: o.stagger ?? 0.08 }, t);
  const slideIn = (sel, t, o = {}) => tl.fromTo(sel, { x: o.x ?? -60, opacity: 0 }, { x: 0, opacity: 1, duration: o.d ?? 0.6, ease: o.ease ?? "power3.out", stagger: o.stagger ?? 0.08 }, t);
  const count = (el, from, to, t, d, o = {}) => {
    const p = { v: from };
    const put = () => { el.textContent = (o.pre ?? "") + fmtID(p.v, o.dec ?? 0) + (o.suf ?? ""); };
    tl.fromTo(p, { v: from }, { v: to, duration: d, ease: o.ease ?? "power2.out", onUpdate: put, onStart: put }, t);
    tl.set({}, { onComplete: put }, t + d);
  };
  const drawPath = (el, t, d, o = {}) => {
    const len = el.getTotalLength ? el.getTotalLength() : 1000;
    tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease: o.ease ?? "power2.inOut" }, t);
  };
  const typeText = (el, text, t, cps = 28) => {
    const p = { n: 0 };
    tl.fromTo(p, { n: 0 }, { n: text.length, duration: text.length / cps, ease: "none", onUpdate: () => { el.textContent = text.slice(0, Math.round(p.n)); } }, t);
  };
  const scaleBar = (sel, t, o = {}) => tl.fromTo(sel, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: o.d ?? 0.9, ease: o.ease ?? "power3.out", stagger: o.stagger ?? 0.1 }, t);
  // ---- motion v2: latar hidup, kamera, efek benturan, teks kinetik ----
  const NS = "http://www.w3.org/2000/svg";
  const D = R.querySelector(".dolly") || S; // kamera frame (drift/shake), di dalam .scene
  let fxSeed = [...ID].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 977);
  const frnd = () => ((fxSeed = (fxSeed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const svgEl = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const div = (parent, style = {}, cls) => {
    const e = document.createElement("div");
    if (cls) e.className = cls;
    Object.assign(e.style, style);
    parent.appendChild(e);
    return e;
  };
  // lapisan di atas .scene (dipakai transisi)
  const overlay = (z) => div(R, { position: "absolute", inset: "0", zIndex: z, pointerEvents: "none" });
  const FX = div(D, {}, "fx");
  const fxSvg = () => svgEl("svg", { viewBox: "0 0 1920 1080" }, FX);

  // latar ambient: grid titik yang bergeser, cahaya lembut, partikel neurotransmiter melayang
  const ambient = (o = {}) => {
    const svg = svgEl("svg", { viewBox: "0 0 1920 1080", class: "amb" });
    D.insertBefore(svg, D.firstChild);
    const defs = svgEl("defs", {}, svg);
    const pid = `amb-d-${ID}`, gid = `amb-g-${ID}`;
    const pat = svgEl("pattern", { id: pid, width: 48, height: 48, patternUnits: "userSpaceOnUse" }, defs);
    svgEl("circle", { cx: 24, cy: 24, r: 2.4, fill: o.dot ?? "#d5e1e3" }, pat);
    const rg = svgEl("radialGradient", { id: gid }, defs);
    svgEl("stop", { offset: "0", "stop-color": o.glow ?? "#dff0ec", "stop-opacity": "1" }, rg);
    svgEl("stop", { offset: "1", "stop-color": o.glow ?? "#dff0ec", "stop-opacity": "0" }, rg);
    const blobs = [0, 1, 2].map(() => svgEl("circle", { cx: (200 + frnd() * 1520).toFixed(0), cy: (150 + frnd() * 780).toFixed(0), r: (380 + frnd() * 240).toFixed(0), fill: `url(#${gid})` }, svg));
    const grid = svgEl("rect", { x: -96, y: -96, width: 2112, height: 1272, fill: `url(#${pid})`, opacity: o.grid ?? 0.6 }, svg);
    const cols = o.cols ?? ["#195764", "#6fa77a", "#e07a1f"];
    const parts = [];
    for (let i = 0; i < (o.n ?? 24); i++) parts.push(svgEl("circle", { cx: (frnd() * 1920).toFixed(0), cy: (frnd() * 1080).toFixed(0), r: (3 + frnd() * 9).toFixed(1), fill: cols[i % cols.length], opacity: (0.1 + frnd() * 0.16).toFixed(2) }, svg));
    tl.fromTo(grid, { x: 0, y: 0 }, { x: -48, y: -48, duration: END, ease: "none" }, 0);
    blobs.forEach((b) => tl.fromTo(b, { x: 0, y: 0 }, { x: (frnd() - 0.5) * 420, y: (frnd() - 0.5) * 260, duration: END, ease: "sine.inOut" }, 0));
    parts.forEach((p) => tl.fromTo(p, { x: 0, y: 0 }, { x: (frnd() - 0.5) * 180, y: -80 - frnd() * 200, duration: END, ease: "none" }, 0));
    return svg;
  };
  // kamera pelan maju sepanjang frame supaya tidak ada gambar yang diam
  const drift = (amt = 0.04) => tl.fromTo(D, { scale: 1 }, { scale: 1 + amt, duration: END, ease: "none" }, 0);
  // guncangan kamera (benturan angka/stempel)
  const shake = (t, amp = 12, d = 0.42) => {
    const n = 7, st = d / n;
    for (let i = 0; i < n; i++) {
      const k = 1 - i / n;
      tl.to(D, { x: (i % 2 ? -1 : 1) * amp * k, y: (((i * 5) % 3) - 1) * amp * 0.6 * k, duration: st, ease: "sine.inOut" }, t + i * st);
    }
    tl.to(D, { x: 0, y: 0, duration: st, ease: "sine.out" }, t + d);
  };
  // ledakan garis + gelombang kejut di titik (x, y) — dipakai saat angka mendarat
  const burst = (x, y, t, o = {}) => {
    const g = svgEl("g", {}, fxSvg());
    const col = o.color ?? "#e07a1f", n = o.n ?? 12, r0 = o.r0 ?? 70, r1 = o.r1 ?? 220;
    tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
    const ring = svgEl("circle", { cx: x, cy: y, r: r0 * 0.5, fill: "none", stroke: o.ring ?? col }, g);
    tl.fromTo(ring, { attr: { r: r0 * 0.4, "stroke-width": 16 } }, { attr: { r: r1 * 1.2, "stroke-width": 0 }, duration: 0.75, ease: "expo.out" }, t);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (o.rot ?? 0.2), c = Math.cos(a), s = Math.sin(a);
      const L = 34 + (i % 3) * 16;
      const ln = svgEl("line", { x1: x, y1: y, x2: x, y2: y, "stroke-width": 0, stroke: i % 3 === 1 ? (o.c2 ?? "#195764") : col, "stroke-linecap": "round" }, g);
      tl.fromTo(ln, { attr: { x1: x + c * r0, y1: y + s * r0, x2: x + c * (r0 + L), y2: y + s * (r0 + L), "stroke-width": 9 } },
        { attr: { x1: x + c * r1, y1: y + s * r1, x2: x + c * r1, y2: y + s * r1, "stroke-width": 0 }, duration: 0.6, ease: "expo.out" }, t);
    }
    tl.set(g, { opacity: 0 }, t + 0.8);
  };
  // kilatan layar penuh
  const flash = (t, o = {}) => {
    const el = div(FX, { background: o.color ?? "#ffffff" }, "flash");
    tl.fromTo(el, { opacity: 0 }, { opacity: o.a ?? 0.7, duration: 0.05, ease: "none" }, t);
    tl.to(el, { opacity: 0, duration: o.d ?? 0.45, ease: "power2.out" }, t + 0.05);
  };
  // konfeti balistik (deterministik: posisi = fungsi waktu)
  const confetti = (x, y, t, o = {}) => {
    const g = svgEl("g", {}, fxSvg());
    const cols = o.cols ?? ["#e07a1f", "#195764", "#aad39c", "#f09a6c", "#2563eb", "#fbbf24"];
    const P = [];
    for (let i = 0; i < (o.n ?? 70); i++) {
      const a = -Math.PI / 2 + (frnd() - 0.5) * (o.spread ?? 2.4), v = 650 + frnd() * 950;
      const el = svgEl("rect", { x: -8, y: -5, width: 16, height: 10, rx: 2, fill: cols[i % cols.length] }, g);
      P.push({ el, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spin: (frnd() - 0.5) * 1500, sx: 0.5 + frnd() * 0.9 });
    }
    const dur = o.d ?? 2.6, G = 1500, p = { k: 0 };
    const put = () => {
      const tt = p.k * dur, drag = 1 - Math.min(0.55, tt * 0.22);
      P.forEach((q) => q.el.setAttribute("transform", `translate(${(x + q.vx * tt * drag).toFixed(1)},${(y + q.vy * tt * drag + 0.5 * G * tt * tt).toFixed(1)}) rotate(${(q.spin * tt).toFixed(0)}) scale(${q.sx.toFixed(2)},1)`));
