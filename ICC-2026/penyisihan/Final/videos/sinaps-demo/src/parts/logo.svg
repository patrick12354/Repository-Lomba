<!-- defaults: p=logo w=200 cls= -->
<svg class="logo {{cls}}" viewBox="0 0 48 48" width="{{w}}" aria-hidden="true">
  <defs>
    <linearGradient id="{{p}}-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6b7a" /><stop offset=".55" stop-color="#0f3a43" /><stop offset="1" stop-color="#0a262c" />
    </linearGradient>
  </defs>
  <rect class="logo-tile" width="48" height="48" rx="14" fill="url(#{{p}}-g)" />
  <path class="logo-pre" d="M29.73 12.98A7 7 0 1 0 19.98 22.73" fill="none" stroke="#eaf3de" stroke-width="4" stroke-linecap="round" />
  <path class="logo-post" d="M28.02 25.27A7 7 0 1 1 18.27 35.02" fill="none" stroke="#aad39c" stroke-width="4" stroke-linecap="round" />
  <circle class="logo-k1" cx="19.98" cy="22.73" r="3" fill="#eaf3de" />
  <circle class="logo-k2" cx="28.02" cy="25.27" r="3" fill="#aad39c" />
  <circle class="logo-nt logo-nt1" cx="24" cy="24" r="1.05" fill="#f09a6c" />
  <circle class="logo-nt logo-nt2" cx="24.85" cy="21.4" r=".75" fill="#f09a6c" />
  <circle class="logo-nt logo-nt3" cx="23.15" cy="26.6" r=".75" fill="#f09a6c" />
</svg>
