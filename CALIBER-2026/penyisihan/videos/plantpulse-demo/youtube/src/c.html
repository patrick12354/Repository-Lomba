<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  .l { position: absolute; left: 0; top: 0; width: 960px; height: 1080px; background: radial-gradient(700px 600px at 50% 55%, rgba(214,60,67,.5), transparent 75%), #fff1ec; }
  .r { position: absolute; left: 960px; top: 0; width: 960px; height: 1080px; background: radial-gradient(700px 600px at 50% 55%, rgba(29,154,99,.45), transparent 75%), #eef8f1; }
  .split { position: absolute; left: 930px; top: -20px; width: 60px; height: 1120px; background: #fff; transform: skewX(-6deg); box-shadow: 0 0 40px rgba(38,48,78,.25); }
  .m1 { left: 20px; top: 420px; width: 880px; transform: rotate(-4deg); filter: drop-shadow(0 30px 40px rgba(164,31,39,.35)) saturate(.8); }
  .m2 { left: 1020px; top: 420px; width: 880px; }
  .h { position: absolute; top: 60px; font: 700 150px/0.9 var(--display); letter-spacing: -0.055em; }
  .h.bad { left: 70px; color: var(--danger); text-shadow: 0 7px 0 #7d1419; }
  .h.good { right: 70px; color: var(--ok); text-shadow: 0 7px 0 #0a4d30; text-align: right; }
  .cap { position: absolute; top: 230px; padding: 12px 24px; border-radius: 16px; font: 700 50px/1 var(--display); letter-spacing: -0.03em; color: #fff; }
  .cap.bad { left: 74px; background: var(--ink-hi); transform: rotate(-3deg); }
  .cap.good { right: 74px; background: var(--ok); transform: rotate(2deg); }
  .pill { position: absolute; padding: 12px 22px; border-radius: 999px; font: 700 40px/1 var(--mono); letter-spacing: .1em; color: #fff; }
  .pill.trip { left: 80px; top: 360px; background: var(--danger); transform: rotate(-4deg); }
  .pill.ok { right: 80px; top: 360px; background: var(--ok); }
  .arrow { position: absolute; left: 820px; top: 470px; width: 280px; height: 170px; }
  .mascot { left: 820px; bottom: 26px; height: 270px; }
  .wm { right: 70px; bottom: 50px; }
</style></head><body>
<div class="l"></div><div class="r"></div><div class="split"></div>
<svg class="machine m1" viewBox="0 0 1000 560"><!-- art:compressor:c1 --><!-- /art --></svg>
<svg class="machine m2" viewBox="0 0 1000 560"><!-- art:compressor:c2 --><!-- /art --></svg>
<div class="h bad">$1.58M<br>LOST</div>
<div class="h good">FIXED.<br>PROVEN.</div>
<div class="pill trip">● TRIP</div><div class="pill ok">✓ VERIFIED</div>
<svg class="arrow" viewBox="0 0 280 170"><path d="M10 85 H200" stroke="#0b1426" stroke-width="30" stroke-linecap="round"/><path d="M170 20 L260 85 L170 150 Z" fill="#0b1426" stroke="#0b1426" stroke-width="10" stroke-linejoin="round"/></svg>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
</body></html>
