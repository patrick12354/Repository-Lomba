<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/pp.css"><link rel="stylesheet" href="common.css">
<style>
  .bg { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(214,60,67,.22), rgba(212,138,6,.14) 45%, rgba(29,154,99,.28)),
    radial-gradient(800px 600px at 100% 0%, rgba(163,206,255,.8), transparent 70%), #faf8ee; }
  h1 { position: absolute; left: 0; right: 0; top: 50px; margin: 0; text-align: center; font: 700 132px/0.95 var(--display); letter-spacing: -0.05em; color: var(--ink-hi); }
  h1 .r { color: var(--danger); } h1 .g { color: var(--ok); }
  .steps { position: absolute; left: 60px; right: 60px; top: 330px; display: flex; align-items: center; justify-content: space-between; }
  .st { width: 400px; height: 400px; border-radius: 36px; background: #fff; border: 3px solid rgba(24,38,72,.14); box-shadow: 0 40px 80px -30px rgba(38,48,78,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .st .ic { width: 150px; height: 150px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font: 700 90px/1 var(--display); color: #fff; }
  .st b { font: 700 58px/1 var(--display); letter-spacing: -0.035em; color: var(--ink-hi); }
  .st small { font: 500 28px/1.2 var(--mono); color: var(--ink-3); }
  .s1 .ic { background: var(--danger); } .s2 .ic { background: var(--accent); } .s3 .ic { background: var(--ok); }
  .s1 { transform: rotate(-3deg); } .s3 { transform: rotate(3deg); border-color: var(--ok); box-shadow: 0 0 0 10px rgba(29,154,99,.18), 0 40px 80px -30px rgba(13,106,66,.6); }
  .ar { font: 700 110px/1 var(--display); color: var(--ink-hi); }
  .mascot { right: 300px; bottom: 10px; height: 230px; transform: rotate(-6deg); }
  .wm { left: 0; right: 0; bottom: 50px; text-align: center; }
</style></head><body>
<div class="bg"></div>
<h1><span class="r">Breakdown</span> → <span class="g">Verified fix</span></h1>
<div class="steps">
  <div class="st s1"><div class="ic">!</div><b>TRIP</b><small>$1.58M recorded loss</small></div>
  <div class="ar">→</div>
  <div class="st s2"><div class="ic">?</div><b>Root cause</b><small>AI + evidence</small></div>
  <div class="ar">→</div>
  <div class="st s3"><div class="ic">✓</div><b>Fixed. Proven.</b><small>owner · proof</small></div>
</div>
<img class="mascot" src="../../assets/mascot/mascot-figure.png">
<div class="wm">Plant<span>Pulse</span></div>
</body></html>
