<script>

  const S = R.querySelector(".scene");

  const $1 = (q) => R.querySelector(q);

  // selector string GSAP dicari di seluruh halaman gabungan; batasi ke frame ini
  const scope = (t) => (typeof t === "string" ? R.querySelectorAll(t) : t);

    const orig = tl[m].bind(tl);
    tl[m] = (t, ...a) => orig(scope(t), ...a);

  // waktu (lokal) kata ke-n di voiceover frame ini yang cocok dengan pola
  const w = (pat, n = 1) => {
    const re = new RegExp(pat, "i");
    let c = 0;
    for (const [t, s] of VOW) if (re.test(t) && ++c === n) return T0 + VO_AT + s;
    throw new Error(`${ID}: kata "${pat}" (#${n}) tidak ada di VO`);
  };
  const fmtID = (v, dec = 0) => {
    const [i, f] = v.toFixed(dec).split(".");
    return i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : "");
  };
  // transisi masuk: iris (lingkaran dari titik), push (geser dari kanan), fade (blur crossfade), none
  const enter = (kind, x = 960, y = 540) => {
    if (kind === "none" || T0 === 0) return;
    const d = 0.62;
    if (kind === "iris") {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 1920 1080");
      Object.assign(svg.style, { position: "absolute", inset: "0", width: "100%", height: "100%", pointerEvents: "none", zIndex: 50 });
      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", x); ring.setAttribute("cy", y); ring.setAttribute("r", 0);
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "#e07a1f"); ring.setAttribute("stroke-width", "14");
      svg.appendChild(ring);
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", 0); dot.setAttribute("fill", "#f09a6c");
      svg.appendChild(dot);
      R.appendChild(svg);
      tl.fromTo(dot, { attr: { r: 0 } }, { attr: { r: 26 }, duration: 0.14, ease: "back.out(3)" }, 0);
      tl.to(dot, { attr: { r: 0 }, duration: 0.18, ease: "power2.in" }, 0.16);
      tl.fromTo(S, { clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(2300px at ${x}px ${y}px)`, duration: d, ease: "power3.inOut" }, 0.1);
      tl.fromTo(ring, { attr: { r: 0 }, opacity: 1 }, { attr: { r: 2300 }, duration: d, ease: "power3.inOut" }, 0.1);
      tl.set(S, { clipPath: "none" }, 0.1 + d);

      tl.fromTo(S, { x: 1920, boxShadow: "-40px 0 80px rgba(16,24,40,.18)" }, { x: 0, duration: d, ease: "power3.inOut" }, 0);

      tl.fromTo(S, { opacity: 0, scale: 1.04, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: d, ease: "sine.inOut" }, 0);

      tl.fromTo(S, { x: -60, skewX: 16 }, { x: 0, skewX: 0, duration: 0.45, ease: "steps(6)" }, 0);

  };

    const len = el.getTotalLength ? el.getTotalLength() : 1000;
    tl.fromTo(el, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: d, ease: o.ease ?? "power2.inOut" }, t);

    const pid = `amb-d-${ID}`, gid = `amb-g-${ID}`;
    const pat = svgEl("pattern", { id: pid, width: 48, height: 48, patternUnits: "userSpaceOnUse" }, defs);
    svgEl("circle", { cx: 24, cy: 24, r: 2.4, fill: o.dot ?? "#d5e1e3" }, pat);
    const rg = svgEl("radialGradient", { id: gid }, defs);
    svgEl("stop", { offset: "0", "stop-color": o.glow ?? "#dff0ec", "stop-opacity": "1" }, rg);
    svgEl("stop", { offset: "1", "stop-color": o.glow ?? "#dff0ec", "stop-opacity": "0" }, rg);
    const blobs = [0, 1, 2].map(() => svgEl("circle", { cx: (200 + frnd() * 1520).toFixed(0), cy: (150 + frnd() * 780).toFixed(0), r: (380 + frnd() * 240).toFixed(0), fill: `url(#${gid})` }, svg));
    const grid = svgEl("rect", { x: -96, y: -96, width: 2112, height: 1272, fill: `url(#${pid})`, opacity: o.grid ?? 0.6 }, svg);
    const cols = o.cols ?? ["#195764", "#6fa77a", "#e07a1f"];
    const parts = [];
    for (let i = 0; i < (o.n ?? 24); i++) parts.push(svgEl("circle", { cx: (frnd() * 1920).toFixed(0), cy: (frnd() * 1080).toFixed(0), r: (3 + frnd() * 9).toFixed(1), fill: cols[i % cols.length], opacity: (0.1 + frnd() * 0.16).toFixed(2) }, svg));
    tl.fromTo(grid, { x: 0, y: 0 }, { x: -48, y: -48, duration: END, ease: "none" }, 0);
    blobs.forEach((b) => tl.fromTo(b, { x: 0, y: 0 }, { x: (frnd() - 0.5) * 420, y: (frnd() - 0.5) * 260, duration: END, ease: "sine.inOut" }, 0));
    parts.forEach((p) => tl.fromTo(p, { x: 0, y: 0 }, { x: (frnd() - 0.5) * 180, y: -80 - frnd() * 200, duration: END, ease: "none" }, 0));
    return svg;
  };
  // kamera pelan maju sepanjang frame supaya tidak ada gambar yang diam
  const drift = (amt = 0.04) => tl.fromTo(D, { scale: 1 }, { scale: 1 + amt, duration: END, ease: "none" }, 0);
  // guncangan kamera (benturan angka/stempel)
  const shake = (t, amp = 12, d = 0.42) => {
    const n = 7, st = d / n;
    for (let i = 0; i < n; i++) {
      const k = 1 - i / n;
      tl.to(D, { x: (i % 2 ? -1 : 1) * amp * k, y: (((i * 5) % 3) - 1) * amp * 0.6 * k, duration: st, ease: "sine.inOut" }, t + i * st);
    }
    tl.to(D, { x: 0, y: 0, duration: st, ease: "sine.out" }, t + d);
  };
  // ledakan garis + gelombang kejut di titik (x, y) — dipakai saat angka mendarat
  const burst = (x, y, t, o = {}) => {
    const g = svgEl("g", {}, fxSvg());
    const col = o.color ?? "#e07a1f", n = o.n ?? 12, r0 = o.r0 ?? 70, r1 = o.r1 ?? 220;
    tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
    const ring = svgEl("circle", { cx: x, cy: y, r: r0 * 0.5, fill: "none", stroke: o.ring ?? col }, g);
    tl.fromTo(ring, { attr: { r: r0 * 0.4, "stroke-width": 16 } }, { attr: { r: r1 * 1.2, "stroke-width": 0 }, duration: 0.75, ease: "expo.out" }, t);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (o.rot ?? 0.2), c = Math.cos(a), s = Math.sin(a);
      const L = 34 + (i % 3) * 16;
      const ln = svgEl("line", { x1: x, y1: y, x2: x, y2: y, "stroke-width": 0, stroke: i % 3 === 1 ? (o.c2 ?? "#195764") : col, "stroke-linecap": "round" }, g);
      tl.fromTo(ln, { attr: { x1: x + c * r0, y1: y + s * r0, x2: x + c * (r0 + L), y2: y + s * (r0 + L), "stroke-width": 9 } },
        { attr: { x1: x + c * r1, y1: y + s * r1, x2: x + c * r1, y2: y + s * r1, "stroke-width": 0 }, duration: 0.6, ease: "expo.out" }, t);
    }
    tl.set(g, { opacity: 0 }, t + 0.8);
  };
  // kilatan layar penuh
  const flash = (t, o = {}) => {
    const el = div(FX, { background: o.color ?? "#ffffff" }, "flash");
    tl.fromTo(el, { opacity: 0 }, { opacity: o.a ?? 0.7, duration: 0.05, ease: "none" }, t);
    tl.to(el, { opacity: 0, duration: o.d ?? 0.45, ease: "power2.out" }, t + 0.05);
  };
  // konfeti balistik (deterministik: posisi = fungsi waktu)
  const confetti = (x, y, t, o = {}) => {
    const g = svgEl("g", {}, fxSvg());
    const cols = o.cols ?? ["#e07a1f", "#195764", "#aad39c", "#f09a6c", "#2563eb", "#fbbf24"];
    const P = [];
    for (let i = 0; i < (o.n ?? 70); i++) {
      const a = -Math.PI / 2 + (frnd() - 0.5) * (o.spread ?? 2.4), v = 650 + frnd() * 950;
      const el = svgEl("rect", { x: -8, y: -5, width: 16, height: 10, rx: 2, fill: cols[i % cols.length] }, g);
      P.push({ el, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spin: (frnd() - 0.5) * 1500, sx: 0.5 + frnd() * 0.9 });
    }
    const dur = o.d ?? 2.6, G = 1500, p = { k: 0 };
    const put = () => {
      const tt = p.k * dur, drag = 1 - Math.min(0.55, tt * 0.22);
      P.forEach((q) => q.el.setAttribute("transform", `translate(${(x + q.vx * tt * drag).toFixed(1)},${(y + q.vy * tt * drag + 0.5 * G * tt * tt).toFixed(1)}) rotate(${(q.spin * tt).toFixed(0)}) scale(${q.sx.toFixed(2)},1)`));
    };
    tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
    tl.fromTo(p, { k: 0 }, { k: 1, duration: dur, ease: "none", onUpdate: put, onStart: put }, t);
    tl.to(g, { opacity: 0, duration: 0.5 }, t + dur - 0.5);
  };
  // kartu judul babak: dua panel menyapu, kata raksasa membanting, lalu menyapu keluar
  const bumper = (word, t, o = {}) => {
    const b = div(S, {}, "bump");
    const cols = o.cols ?? ["#e07a1f", "#195764"];
    const p1 = div(b, { background: cols[0] }, "bp"), p2 = div(b, { background: cols[1] }, "bp");
    const bw = div(b, {}, "bw"); bw.textContent = word;
    const bs = o.sub ? div(b, {}, "bs") : null; if (bs) bs.textContent = o.sub;
    const hold = o.hold ?? 0.8;
    tl.fromTo(p1, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "power4.inOut" }, t);
    tl.fromTo(p2, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "power4.inOut" }, t + 0.08);
    tl.fromTo(bw, { scale: 1.6, scaleX: 2.1, opacity: 0 }, { scale: 1, scaleX: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, t + 0.2);
    if (bs) tl.fromTo(bs, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, t + 0.32);
    tl.to(bw, { scale: 1.07, duration: hold, ease: "none" }, t + 0.62);
    const out = t + 0.32 + hold;
    tl.to(bs ? [bw, bs] : bw, { opacity: 0, y: -50, duration: 0.2, ease: "power2.in" }, out);
    tl.to(p2, { clipPath: "inset(0 0 0 100%)", duration: 0.3, ease: "power4.inOut" }, out + 0.1);
    tl.to(p1, { clipPath: "inset(0 0 0 100%)", duration: 0.3, ease: "power4.inOut" }, out + 0.18);
    tl.set(b, { display: "none" }, out + 0.5);
    return out + 0.4;
  };
  // pecah teks jadi kata (tag <b>/<em> di dalamnya dipertahankan) lalu muncul berjenjang
  const splitWords = (el) => {
    const walk = (node) => [...node.childNodes].forEach((c) => {
      if (c.nodeType === 3) {
        const frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;
          if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
          else { const s = document.createElement("span"); s.className = "wd"; s.style.display = "inline-block"; s.textContent = part; frag.appendChild(s); }
        });
        c.replaceWith(frag);
      } else if (c.nodeType === 1 && !c.classList.contains("wd")) walk(c);
    });
    walk(el);
    return [...el.querySelectorAll(".wd")];
  };
  const words = (sel, t, o = {}) => {
    const els = typeof sel === "string" ? [...R.querySelectorAll(sel)] : [sel].flat();
    els.forEach((el) => tl.fromTo(splitWords(el), { y: o.y ?? 46, opacity: 0, rotation: o.r ?? 4 }, { y: 0, opacity: 1, rotation: 0, duration: o.d ?? 0.5, ease: o.ease ?? "back.out(1.8)", stagger: o.stagger ?? 0.045 }, t));
  };
  // stabilo menyapu di bawah teks penting
  const mark = (sel, t, o = {}) => {
    const els = typeof sel === "string" ? [...R.querySelectorAll(sel)] : [sel].flat();
    els.forEach((el) => { el.classList.add("hl-mark"); if (o.color) el.style.setProperty("--hlc", o.color); });
    tl.fromTo(els, { backgroundSize: "0% 38%" }, { backgroundSize: "100% 38%", duration: o.d ?? 0.55, ease: "power2.inOut" }, t);
  };
  // angka mendarat: membal + burst + shake (satu panggilan untuk semua momen "hit")
  const hit = (sel, x, y, t, o = {}) => {
    tl.fromTo(sel, { scale: 1 }, { scale: o.s ?? 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false, transformOrigin: o.origin ?? "50% 50%" }, t);
    burst(x, y, t, o);
    if (o.shake !== 0) shake(t, o.shake ?? 9);
  };
  // kamera di dalam jendela rekaman: pusatkan titik (rx, ry) piksel rekaman 1920x1200 pada skala s
  const camTo = (el, rx, ry, s, t, d = 1.1, o = {}) => {
    const k = o.k ?? 0.71875, VW = o.vw ?? 1380, VH = o.vh ?? 862;
    const x = Math.min(0, Math.max(VW - VW * s, VW / 2 - rx * k * s)), y = Math.min(0, Math.max(VH - VH * s, VH / 2 - ry * k * s));
    tl.set(el, { transformOrigin: "0% 0%" }, 0);
    tl.to(el, { x, y, scale: s, duration: d, ease: o.ease ?? "power3.inOut" }, t);
    return { x, y, s };
  };
  if (R.dataset.amb !== "0") ambient();
  if (R.dataset.drift !== "0") drift(Number(R.dataset.drift || 0.04));
  // ---- akhir helper ----

enter("push");
  rise(".side .n", 0.6, { y: 14 });
  rise(".side h2", 0.7, { y: 24 });
  rise(".side p", 0.85, { y: 14 });
  tl.fromTo(".win.c", { y: 60, opacity: 0, scale: 0.95 }, { y: 0, opacity: 1, scale: 1, duration: 0.7 }, 0.45);
  tl.fromTo(".win.l", { rotationY: 70, opacity: 0, transformOrigin: "100% 50%" }, { rotationY: 28, opacity: 1, duration: 0.9 }, 0.9);
  tl.fromTo(".win.r", { rotationY: -70, opacity: 0, transformOrigin: "0% 50%" }, { rotationY: -28, opacity: 1, duration: 0.9 }, 1.05);
  const co = [...$(".callout")];
  // karosel: jendela kiri (tinjau kesalahan) lalu kanan (audit tutor) maju ke depan
  pop(co[0], w("peta"), { from: 0.6, origin: "0% 50%" });
  tl.to(co[0], { opacity: 0, duration: 0.2 }, w("kesalahan") - 0.3);
  tl.to(".win.l", { rotationY: 0, x: 120, scale: 1.12, filter: "brightness(1)", zIndex: 5, duration: 0.6, ease: "power3.inOut" }, w("kesalahan") - 0.4);
  pop(co[1], w("kesalahan"), { from: 0.6, origin: "0% 50%" });
  tl.to(".win.l", { rotationY: 28, x: 0, scale: 1, filter: "brightness(.82)", zIndex: 1, duration: 0.5, ease: "power3.inOut" }, w("audit") - 0.5);
  tl.to(co[1], { opacity: 0, duration: 0.2 }, w("audit") - 0.4);
  tl.to(".win.r", { rotationY: 0, x: -260, scale: 1.15, filter: "brightness(1)", zIndex: 5, duration: 0.6, ease: "power3.inOut" }, w("audit") - 0.4);
  pop(co[2], w("audit"), { from: 0.6, origin: "0% 50%" });
  leave();
  window.__timelines[ID] = tl;
})();
