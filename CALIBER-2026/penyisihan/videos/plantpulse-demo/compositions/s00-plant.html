            pump: '<circle cx="30" cy="40" r="13"/><circle cx="30" cy="40" r="4"/><rect x="45" y="32" width="20" height="16" rx="4"/><path d="M30 27 L30 18 L40 18"/><path d="M12 58 L66 58"/>',
            fan: '<circle cx="38" cy="38" r="20"/><path d="M38 38 L38 22 Q46 26 38 38 Q54 40 50 46 Q44 52 38 38 Q26 50 24 42 Q22 34 38 38"/>',
            col: '<rect x="30" y="12" width="16" height="50" rx="8"/><path d="M26 26 L50 26 M26 40 L50 40 M26 54 L50 54"/>',
            hx: '<rect x="12" y="28" width="52" height="22" rx="11"/><path d="M20 34 L56 34 M20 39 L56 39 M20 44 L56 44"/><path d="M24 50 L22 58 M52 50 L54 58"/>',
          };
          const KINDS = ["pump", "comp", "fan", "hx", "pump", "col", "fan", "pump", "hx", "comp"];
          const tiles = document.getElementById("s00-tiles"), lanes = document.getElementById("s00-lanes");
          const T = [];
          for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
            const x = CX + (c - HC) * PITCH, y = CY + (r - HR) * PITCH, hero = r === HR && c === HC;
            const k = hero ? "comp" : KINDS[(r * 7 + c * 3 + ((r * c) % 4)) % KINDS.length];
            const d = document.createElement("div");
            d.className = "tile" + (hero ? " hero" : ""); d.id = `s00-t${r}-${c}`;
            d.style.left = x + "px"; d.style.top = y + "px";
            d.innerHTML = `<svg viewBox="0 0 76 76" fill="none" stroke="${hero ? "#0b1426" : "#3a4864"}" stroke-width="${hero ? 3 : 2.4}" stroke-linejoin="round" stroke-linecap="round">${G[k]}</svg><i></i>`;
            tiles.appendChild(d);
            T.push({ el: d, r, c, x, y, dist: Math.hypot(c - HC, r - HR), hero });
          }
          // Product lanes along each row (behind the tiles); a lane right of the stopped machine stops with it.
          const L = [];
          for (let r = 0; r < ROWS; r++) {
            const y = CY + (r - HR) * PITCH;
            const base = document.createElementNS(NS, "path");
            base.setAttribute("d", `M -60 ${y} L 1980 ${y}`); base.setAttribute("stroke", "rgba(24,38,72,0.16)"); base.setAttribute("stroke-width", "10"); base.setAttribute("stroke-linecap", "round");
            const dash = document.createElementNS(NS, "path");
            dash.setAttribute("d", `M -60 ${y} L 1980 ${y}`); dash.setAttribute("stroke", "#2f62e0"); dash.setAttribute("stroke-width", "4"); dash.setAttribute("stroke-dasharray", "14 20"); dash.setAttribute("opacity", "0"); dash.id = "s00-lane" + r;
            lanes.append(base, dash);
            L.push({ dash, r });
          }
          // Lanes that stop: the hero's row and its neighbours, cascading outward.
          const STOP = 7.25;
          const laneStop = (r) => ({ 4: STOP + 0.15, 3: STOP + 0.55, 5: STOP + 0.65, 2: STOP + 1.0, 6: STOP + 1.1 })[r];

          // ---- continuous motion, a pure function of scene time (seek-safe) -------------------------
          const flowIn = document.getElementById("s00-flow-in"), flowOut = document.getElementById("s00-flow-out");
          const sh = document.getElementById("s00-shaft-stripes"), cp = document.getElementById("s00-cpl-stripes");
          const rack = document.getElementById("s00-rackflow"), flare = document.getElementById("s00-flare");
          const sim = (t) => {
            flowIn.style.strokeDashoffset = -t * 90; flowOut.style.strokeDashoffset = -t * 90;
            sh.setAttribute("transform", `translate(0 ${(t * 160) % 16})`); cp.setAttribute("transform", `translate(0 ${(t * 160) % 18})`);
            rack.style.strokeDashoffset = -t * 80;
            flare.setAttribute("transform", `translate(1822 228) scale(${1 + 0.08 * Math.sin(t * 17) + 0.05 * Math.sin(t * 29)} ${1 + 0.14 * Math.sin(t * 13) + 0.06 * Math.sin(t * 31)}) translate(-1822 -228)`);
            for (const l of L) { const s = laneStop(l.r); l.dash.style.strokeDashoffset = -Math.min(t, s ?? t) * 70; }
          };
          const clock = { t: 0 };
          sim(0);

          const tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => sim(clock.t) }, 0);

          // 1. Skyline draws itself (0 - 1.5 s), product flows along the rack, the flare lights.
          tl.fromTo("#s00-grid", { opacity: 0 }, { opacity: 0.45, duration: 1.0 }, 0);
          tl.fromTo("#s00-sky-lines > *", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut", stagger: 0.035 }, 0.05);
          tl.to("#s00-sky-fill", { opacity: 1, duration: 0.6 }, 0.8);
          tl.to("#s00-flare", { opacity: 1, duration: 0.3 }, 0.9);
          tl.to("#s00-rackflow", { opacity: 0.8, duration: 0.4 }, 0.9);
          tl.fromTo("#s00-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.3);
          tl.fromTo("#s00-house-ring", { opacity: 0, scale: 1.15, transformOrigin: "1100px 682px" }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.1);
          tl.fromTo("#s00-house-lbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.2);

          // 2. "This is a compressor": dive into the house; the machine is drawn up behind a scan line.
          tl.to("#s00-sky", { scale: 4.2, transformOrigin: "1100px 690px", opacity: 0, duration: 0.75, ease: "power3.in" }, 1.55);
          tl.to("#s00-kick", { opacity: 0, duration: 0.3 }, 1.6);
          tl.fromTo("#s00-art", { opacity: 0, scale: 0.7, transformOrigin: "960px 520px" }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 2.15);
          tl.fromTo("#s00-machine-body", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 2.15);
          tl.fromTo("#s00-scan", { x: -40, opacity: 1 }, { x: 1010, duration: 0.9, ease: "power2.inOut" }, 2.15);
          tl.to("#s00-scan", { opacity: 0, duration: 0.2 }, 3.0);
          ["#s00-l1", "#s00-l4", "#s00-l3", "#s00-l2", "#s00-l5", "#s00-l6"].forEach((s, i) =>
            tl.fromTo(s, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.75 + i * 0.12));
          tl.fromTo("#s00-run", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 3.2);

          // 3. "one of hundreds of machines": the drawing shrinks into its tile; the field fills around it.
          tl.to("#s00-labels, #s00-run", { opacity: 0, duration: 0.3 }, 3.75);
          tl.to("#s00-machine", { attr: { transform: "translate(925 450) scale(0.072)" }, duration: 0.85, ease: "power3.inOut" }, 3.85);
          tl.to("#s00-art", { opacity: 0, duration: 0.2 }, 4.6);
          T.forEach((o) => tl.fromTo(o.el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, o.hero ? 4.5 : 4.45 + o.dist * 0.07));
          tl.fromTo("#s00-lanes", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.45);
          tl.fromTo("#s00-meter", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.3);
          // "keep the plant running": product runs down every lane.
          L.forEach((l, i) => tl.to(l.dash, { opacity: 0.85, duration: 0.4 }, 5.45 + Math.abs(i - HR) * 0.06));
          tl.fromTo("#s00-mfill", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 5.5);

          // 4. "when it stops": the hero tile trips red; "production stops with it": the lanes and machines downstream stall.
          const hero = T.find((o) => o.hero).el;
          tl.to(hero, { borderColor: "#d63c43", backgroundColor: "#fdecec", boxShadow: "0 0 0 6px rgba(214,60,67,0.2), 0 14px 30px -10px rgba(214,60,67,0.6)", scale: 1.25, duration: 0.2 }, STOP - 0.1);
          tl.to(hero.querySelector("i"), { backgroundColor: "#d63c43", boxShadow: "0 0 0 3px rgba(214,60,67,0.25)", duration: 0.15 }, STOP - 0.1);
          tl.to(hero, { keyframes: { x: [0, -6, 5, -3, 0] }, duration: 0.3, ease: "none" }, STOP);
          tl.fromTo("#s00-ping", { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 2.8, duration: 0.9, ease: "expo.out", immediateRender: false }, STOP);
          L.forEach((l) => { const s = laneStop(l.r); if (s) tl.to(l.dash, { stroke: "#9aa3b5", duration: 0.3 }, s); });
          T.filter((o) => !o.hero && Math.abs(o.r - HR) <= 2 && o.c >= HC - 1).forEach((o) => {
            const at = STOP + 0.25 + Math.abs(o.r - HR) * 0.35 + Math.abs(o.c - HC) * 0.07;
            tl.to(o.el, { opacity: 0.45, duration: 0.3 }, at);
            tl.to(o.el.querySelector("i"), { backgroundColor: "#d48a06", boxShadow: "0 0 0 3px rgba(212,138,6,0.2)", duration: 0.2 }, at);
          });
          tl.to("#s00-mfill", { scaleX: 0.04, background: "linear-gradient(90deg, #d63c43, #e2575d)", duration: 1.0, ease: "power2.inOut" }, 7.75);
          tl.set("#s00-mstate", { textContent: "● STOPPED", color: "#a41f27" }, 8.0);
          tl.to("#s00-meter", { keyframes: { x: [0, -8, 6, -3, 0] }, duration: 0.3, ease: "none" }, 8.0);

          // Hand-off: dive into the stopped machine.
          tl.to("#s00-tiles, #s00-lanes", { scale: 9, transformOrigin: "960px 470px", duration: 0.9, ease: "power3.in" }, 9.05);
          tl.to("#s00-meter", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, 9.05);
          tl.to("#s00-flash", { opacity: 1, duration: 0.35, ease: "power2.in" }, 9.6);
          // time-warp (written by scripts/warp.mjs): [authored s, current s] anchors through every spoken word.
          const WARP = [[0,0],[1.4,1.4],[1.748,1.655],[1.899,1.911],[1.992,2.062],[4.094,2.816],[4.256,3.014],[4.407,3.211],[4.825,3.734],[4.953,3.954],[5.336,4.453],[5.522,4.674],[5.881,5.498],[6.195,5.87],[6.775,6.911],[6.973,7.12],[7.089,7.236],[8.018,9.309],[8.923,10.005],[10,11.08]];
          window.__timelines["s00-plant"] = ((src, P) => {
            const end = P[P.length - 1];
            const back = (t) => { for (let i = 1; i < P.length; i++) if (t <= P[i][1]) { const [a0, b0] = P[i - 1], [a1, b1] = P[i]; return a0 + (a1 - a0) * ((t - b0) / (b1 - b0)); } return end[0]; };
            const w = gsap.timeline({ paused: true });
            w.fromTo(src, { time: 0 }, { time: end[0], duration: end[1], ease: (p) => back(p * end[1]) / end[0], immediateRender: true });
            return w;
          })(tl, WARP);
        })();
      </script>
    </template>
